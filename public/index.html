/** Category editor. Pass null to create one. */
function categoryModal(id){
  const cat = id ? catById(id) : null;
  const swatches = PALETTE.map(c =>
    `<button type="button" class="swatch${(cat ? cat.color : "c3") === c ? " on" : ""}"
       data-color="${c}" style="background:var(--${c})" aria-label="Colour ${c}"></button>`).join("");

  const inUse = cat ? DECKS.filter(d => d.cat === cat.id).length : 0;
  modal(`<h3>${cat ? "Edit category" : "New category"}</h3>
    <label for="cn">Name</label>
    <input id="cn" maxlength="30" placeholder="e.g. Chemistry" value="${cat ? esc(cat.name) : ""}">
    <label>Colour</label>
    <div class="swatches" id="sw">${swatches}</div>
    ${cat ? `<button class="linkbtn danger" id="delCat">Delete this category${
      inUse ? ` (${inUse} deck${inUse===1?"":"s"} will move to Uncategorised)` : ""}</button>` : ""}`,
    () => {
      const name = $("cn").value.trim();
      if (!name) return false;
      const color = $("sw").querySelector(".swatch.on")?.dataset.color || "c3";
      if (cat) { cat.name = name; cat.color = color; touchCategory(cat.id); }
      else S.categories.push({ id: uid("cat"), name, color, updated_at: nowISO() });
      queueSync(); save(); renderHome(); toast(cat ? "Category updated" : "Category added");
    });

  $("sw").querySelectorAll(".swatch").forEach(b => b.onclick = () => {
    $("sw").querySelectorAll(".swatch").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });

  if (cat) $("delCat").onclick = () => {
    /* Decks are never destroyed with their category — they fall through to
       Uncategorised, where they can be re-filed. */
    S.categories = S.categories.filter(c => c.id !== cat.id);
    markDeleted("cat", cat.id); save(); $("modalHost").innerHTML = ""; renderHome();
    toast(inUse ? `Category deleted, ${inUse} deck${inUse===1?"":"s"} moved to Uncategorised` : "Category deleted");
  };
}

/** Per-deck settings: rename, re-file, export, delete cards, delete deck. */
function deckSettings(deckId){
  const d = S.decks.find(x => x.id === deckId);
  if (!d) return;
  const opts = S.categories.map(c =>
    `<option value="${c.id}"${c.id === d.cat ? " selected" : ""}>${esc(c.name)}</option>`).join("");

  modal(`<h3>${esc(d.name)}</h3>
    <label for="dn2">Deck name</label>
    <input id="dn2" maxlength="60" value="${esc(d.name)}">
    <label for="dc2">Category</label>
    <select id="dc2">${opts}<option value="${UNFILED}"${catById(d.cat)?"":" selected"}>Uncategorised</option></select>
    <div class="stack">
      <button class="linkbtn" id="dCards">Manage ${d.cards.length} card${d.cards.length===1?"":"s"}</button>
      <button class="linkbtn" id="dExport">Export to share</button>
      <button class="linkbtn danger" id="dDelete">Delete this deck</button>
    </div>`,
    () => {
      const name = $("dn2").value.trim();
      if (!name) return false;
      d.name = name; d.cat = $("dc2").value;
      touchDeck(d.id); save(); renderHome(); toast("Deck updated");
    });

  $("dCards").onclick = () => { $("modalHost").innerHTML = ""; cardManager(deckId); };
  $("dExport").onclick = () => { $("modalHost").innerHTML = ""; exportModal(deckId); };
  $("dDelete").onclick = () => {
    confirmModal(
      `Delete "${d.name}"?`,
      `${d.cards.length} card${d.cards.length===1?"":"s"} will be gone for good. This cannot be undone.`,
      "Delete deck",
      () => {
        S.decks = S.decks.filter(x => x.id !== deckId);
        delete S.progress[deckId]; delete S.starred[deckId]; delete (S.best||{})[deckId];
        markDeleted("deck", deckId);
        save(); renderHome(); toast("Deck deleted");
      });
  };
}

/** A list of every card in a deck, each removable. */
function cardManager(deckId){
  const render = () => {
    const d = S.decks.find(x => x.id === deckId);
    if (!d) return renderHome();
    showScreen("review");
  $("reviewTitle").textContent = "Manage cards";
    $("reviewBody").innerHTML = `
      <div class="rhead">
        <h3>${esc(d.name)}</h3>
        <p class="sub">${d.cards.length} card${d.cards.length===1?"":"s"}. Removing a card also clears its star and cannot be undone.</p>
      </div>
      ${d.cards.map(c => `<div class="rcard">
          <div class="top">
            <div class="body">
              <p class="q">${esc(c[0])}</p>
              <p class="a">${esc(c[1])}</p>
              ${cardWhy(c) ? `<p class="whyline">${esc(cardWhy(c))}</p>` : ""}
            </div>
            <button class="edit danger" data-del="${esc(cardId(c))}">Remove</button>
          </div>
        </div>`).join("") || `<div class="empty">This deck has no cards. Add one while studying, or scan a page of notes.</div>`}
      <div class="rfoot"><div class="row">
        <button class="act primary" id="cmDone">Done</button>
      </div></div>`;

    $("reviewBody").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const id = b.dataset.del;
      const card = d.cards.find(c => cardId(c) === id);
      confirmModal("Remove this card?", card ? card[0] : "", "Remove", () => {
        d.cards = d.cards.filter(c => cardId(c) !== id);
        if (S.starred[deckId]) S.starred[deckId] = S.starred[deckId].filter(x => x !== id);
        delete S.progress[deckId];   // the old known/total no longer describes this deck
        touchDeck(deckId); save(); render(); toast("Card removed");
      });
    });
    $("cmDone").onclick = () => renderHome();
  };
  render();
}

/* ---------------- share codes ----------------
   Raw JSON for a 23-card deck is ~8 KB, which is unusable as something you
   paste into a chat, so the payload is deflated and base64url'd. Typical deck
   lands in the hundreds of characters. */
const CODE_PREFIX = "STUDYDECK1.";

const b64urlEncode = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64urlDecode = s => {
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(t + "=".repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));
};

async function deflate(str){
  const cs = new CompressionStream("deflate-raw");
  const buf = await new Response(new Blob([str]).stream().pipeThrough(cs)).arrayBuffer();
  return new Uint8Array(buf);
}
async function inflate(bytes){
  const ds = new DecompressionStream("deflate-raw");
  return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
}

async function makeCode(deckId){
  const d = S.decks.find(x => x.id === deckId);
  const cat = catById(d.cat);
  const payload = {
    n: d.name,
    c: cat ? { n: cat.name, k: cat.color } : null,
    k: d.cards.map(c => [c[0], c[1], c[2] || "concept", Array.isArray(c[3]) ? c[3] : null, c[5] || null]),
  };
  return CODE_PREFIX + b64urlEncode(await deflate(JSON.stringify(payload)));
}

/**
 * Everything here arrives from someone else, so nothing is trusted: types are
 * checked, lengths capped, counts capped, and every field coerced to a string
 * before it ever reaches the DOM (where esc() escapes it again).
 */
function sanitiseImport(raw){
  if (!raw || typeof raw !== "object") throw new Error("That code doesn't contain a deck.");
  const str = (v, max) => typeof v === "string" ? v.replace(/\s+/g," ").trim().slice(0, max) : "";
  const name = str(raw.n, 60) || "Shared deck";
  if (!Array.isArray(raw.k)) throw new Error("That code doesn't contain any cards.");
  if (raw.k.length > 500) throw new Error("That deck has more than 500 cards, which is too many to import.");

  const cards = raw.k.map(c => {
    if (!Array.isArray(c)) return null;
    const q = str(c[0], 400), a = str(c[1], 400);
    if (!q || !a) return null;
    const group = str(c[2], 24).toLowerCase() || "concept";
    const ds = Array.isArray(c[3])
      ? c[3].map(x => str(x, 400)).filter(Boolean).slice(0, 4)
      : [];
    const why = str(c[4], 400) || null;
    return withId([q, a, group, ds.length ? ds : null, null, why]);
  }).filter(Boolean);

  if (!cards.length) throw new Error("No usable cards were found in that code.");
  const cat = raw.c && typeof raw.c === "object"
    ? { name: str(raw.c.n, 30) || "Imported", color: PALETTE.includes(raw.c.k) ? raw.c.k : "c3" }
    : null;
  return { name, cards, cat };
}

async function decodeShare(text){
  const code = String(text || "").trim().replace(/\s+/g,"");
  if (!code) throw new Error("Paste a code first.");
  if (!code.startsWith(CODE_PREFIX)) throw new Error("That doesn't look like a Study Deck code — it should start with STUDYDECK1.");
  let json;
  try { json = await inflate(b64urlDecode(code.slice(CODE_PREFIX.length))); }
  catch { throw new Error("That code is damaged or incomplete. Ask for it again — chat apps sometimes cut long codes short."); }
  let parsed;
  try { parsed = JSON.parse(json); } catch { throw new Error("That code is damaged or incomplete."); }
  return sanitiseImport(parsed);
}

/* ------------------------------------------------------------------
   ACCOUNTS AND SYNC

   Accounts are additive. With no Supabase project configured, or with
   nobody signed in, the app behaves exactly as it always has: everything
   lives in localStorage and every feature except sync works. The sign-in
   prompt is an offer, never a wall.

   localStorage stays the source of truth for rendering, so the app is
   instant and works offline. The network is a background concern.
------------------------------------------------------------------ */

/* Fill these in from Supabase → Project Settings → API. Both are safe in the
   repo: the anon key identifies the project, it does not grant access. Row
   Level Security is what keeps one person's decks away from another's. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const SCAN_LIMIT_PER_DAY = 5;

/** Everything that talks to the backend, so the sync logic can be tested. */
const cloud = {
  client: null,
  user: null,
  status: "off",        // off | signedout | syncing | synced | offline | error
  lastSync: null,
  note: "",

  configured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); },

  async init(){
    if (!this.configured()) { this.status = "off"; return; }
    try {
      const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
      this.client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
      });
    } catch {
      this.status = "error"; this.note = "Could not load the accounts library.";
      return;
    }
    const { data } = await this.client.auth.getSession();
    this.user = data?.session?.user || null;
    this.status = this.user ? "syncing" : "signedout";
    this.client.auth.onAuthStateChange((_e, session) => {
      const was = this.user?.id;
      this.user = session?.user || null;
      if (this.user && this.user.id !== was) syncNow({ firstLogin: true });
      if (!this.user) { this.status = "signedout"; renderAccountBar(); }
    });
  },

  async signUp(email, password){
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw new Error(authMessage(error));
    // With email confirmation on there is no session until they click the link.
    return { needsConfirmation: !data.session };
  },
  async signIn(email, password){
    const { error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw new Error(authMessage(error));
  },
  async signOut(){
    await this.client.auth.signOut();
    this.user = null; this.status = "signedout";
  },
  async resetPassword(email){
    const { error } = await this.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    if (error) throw new Error(authMessage(error));
  },
  async accessToken(){
    const { data } = await this.client.auth.getSession();
    return data?.session?.access_token || null;
  },

  /* --- rows --- */
  async pull(){
    const [cats, decks, state] = await Promise.all([
      this.client.from("categories").select("*"),
      this.client.from("decks").select("*"),
      this.client.from("study_state").select("*").maybeSingle(),
    ]);
    for (const r of [cats, decks]) if (r.error) throw new Error(r.error.message);
    return { categories: cats.data || [], decks: decks.data || [], state: state.data || null };
  },
  async pushDecks(rows){
    if (!rows.length) return;
    const { error } = await this.client.from("decks").upsert(rows);
    if (error) throw new Error(error.message);
  },
  async pushCategories(rows){
    if (!rows.length) return;
    const { error } = await this.client.from("categories").upsert(rows);
    if (error) throw new Error(error.message);
  },
  async pushState(state){
    const { error } = await this.client.from("study_state")
      .upsert({ user_id: this.user.id, state, updated_at: new Date().toISOString() });
    if (error) throw new Error(error.message);
  },
};

/** Supabase error text is for developers. Say what to actually do. */
function authMessage(error){
  const m = String(error?.message || "").toLowerCase();
  if (m.includes("already registered") || m.includes("already been registered"))
    return "That email already has an account. Try signing in instead.";
  if (m.includes("invalid login")) return "That email and password don't match.";
  if (m.includes("email not confirmed"))
    return "Check your email and click the confirmation link first.";
  if (m.includes("password") && m.includes("6"))
    return "Passwords need to be at least 6 characters.";
  if (m.includes("rate limit") || m.includes("too many"))
    return "Too many attempts. Wait a minute and try again.";
  if (m.includes("invalid email") || m.includes("unable to validate"))
    return "That doesn't look like an email address.";
  if (m.includes("failed to fetch") || m.includes("network"))
    return "Couldn't reach the accounts service. Check your connection.";
  return error?.message || "Something went wrong signing in.";
}

/* ---------------- change stamps ----------------
   Sync needs to know which side is newer, so every mutation stamps the row it
   touched. Without this, sync could not tell an edit from an untouched copy. */
const nowISO = () => new Date().toISOString();

function touchDeck(id){
  const d = S.decks.find(x => x.id === id);
  if (d) d.updated_at = nowISO();
  queueSync();
}
function touchCategory(id){
  const c = S.categories.find(x => x.id === id);
  if (c) c.updated_at = nowISO();
  queueSync();
}
function touchState(){ S.stateUpdatedAt = nowISO(); queueSync(); }

/** Remember deletions so they can propagate; a hard delete would come back. */
function markDeleted(kind, id){
  S.tombstones = S.tombstones || {};
  S.tombstones[kind + ":" + id] = nowISO();
  queueSync();
}

let syncTimer = null;
function queueSync(){
  if (!cloud.user) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), 1200);
}

/* ---------------- the merge ----------------
   Last-write-wins per row on updated_at. Pure, so it can be tested without a
   network: give it both sides, get back what each side should end up with. */
/* Date.parse(0) is not 0 — it parses the string "0" as the year 2000, so a
   row with no stamp would look newer than genuinely recent server data and
   overwrite it. An unknown time must sort oldest. */
const stamp = v => {
  if (!v) return 0;
  const t = Date.parse(v);
  return Number.isFinite(t) ? t : 0;
};

function mergeRows(local, remote, { deletedLocally = {} } = {}){
  const byId = new Map();
  for (const r of remote) byId.set(r.id, { ...r, _from: "remote" });

  const toPush = [];
  for (const l of local) {
    const r = byId.get(l.id);
    if (!r) { byId.set(l.id, { ...l, _from: "local" }); toPush.push(l); continue; }
    const lt = stamp(l.updated_at);
    const rt = stamp(r.updated_at);
    if (lt > rt) { byId.set(l.id, { ...l, _from: "local" }); toPush.push(l); }
  }
  // a deletion is just another dated fact about a row
  for (const [key, when] of Object.entries(deletedLocally)) {
    const id = key.split(":").slice(1).join(":");
    const row = byId.get(id);
    if (!row) continue;
    if (stamp(when) >= stamp(row.updated_at)) {
      byId.set(id, { ...row, deleted_at: when, _from: "local" });
      toPush.push({ ...row, deleted_at: when });
    }
  }
  const merged = [...byId.values()].filter(r => !r.deleted_at);
  return { merged, toPush };
}

/** Pull, merge, push. Safe to call often; it is debounced by queueSync. */
async function syncNow({ firstLogin = false } = {}){
  if (!cloud.user || !cloud.client) return;
  if (syncNow._busy) { syncNow._again = true; return; }
  syncNow._busy = true;
  cloud.status = "syncing"; renderAccountBar();

  try {
    const remote = await cloud.pull();
    const uid = cloud.user.id;
    const tomb = S.tombstones || {};

    const localDecks = S.decks.map(d => ({
      id: d.id, user_id: uid, cat: d.cat || null, name: d.name,
      note: d.note || "", cards: d.cards,
      updated_at: d.updated_at || new Date(0).toISOString(),
    }));
    const localCats = S.categories.map(c => ({
      id: c.id, user_id: uid, name: c.name, color: c.color,
      updated_at: c.updated_at || new Date(0).toISOString(),
    }));

    const dm = mergeRows(localDecks, remote.decks, { deletedLocally: pick(tomb, "deck") });
    const cm = mergeRows(localCats, remote.categories, { deletedLocally: pick(tomb, "cat") });

    /* On the very first sign-in on a device, anything local that the account
       has never seen is uploaded rather than discarded. That is the whole
       point: your existing decks come with you. */
    await cloud.pushCategories(cm.toPush.map(strip));
    await cloud.pushDecks(dm.toPush.map(strip));

    S.decks = dm.merged.map(r => ({
      id: r.id, cat: r.cat, name: r.name, note: r.note || "",
      cards: (r.cards || []).map(withId), updated_at: r.updated_at,
    }));
    S.categories = cm.merged.map(r => ({
      id: r.id, name: r.name, color: r.color, updated_at: r.updated_at,
    }));
    if (!S.categories.length) S.categories = defaultCategories();

    // study state is one small blob; newest wins outright
    const localState = { progress:S.progress, starred:S.starred, best:S.best, streak:S.streak, lastCat:S.lastCat };
    const rt = stamp(remote.state?.updated_at);
    const lt = stamp(S.stateUpdatedAt);
    if (rt > lt && remote.state?.state) {
      Object.assign(S, remote.state.state);
      S.stateUpdatedAt = remote.state.updated_at;
    } else if (lt > rt || firstLogin) {
      await cloud.pushState(localState);
    }

    // tombstones that the server has now accepted have done their job
    S.tombstones = {};
    cloud.status = "synced";
    cloud.lastSync = Date.now();
    cloud.note = "";
    await save();
    renderIfHome();
  } catch (e) {
    cloud.status = navigator.onLine === false ? "offline" : "error";
    cloud.note = e?.message || "Sync failed.";
    console.warn("[sync]", e);
  } finally {
    syncNow._busy = false;
    renderAccountBar();
    if (syncNow._again) { syncNow._again = false; queueSync(); }
  }
}

const pick = (obj, prefix) => Object.fromEntries(
  Object.entries(obj).filter(([k]) => k.startsWith(prefix + ":")));
const strip = r => { const { _from, ...rest } = r; return rest; };
const renderIfHome = () => { if (!$("home").classList.contains("hide")) renderHome(); };

  }[cloud.status] || "";

function ago(t){
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  return Math.round(s/3600) + "h ago";
}

        $("auDone").onclick = () => renderHome();
        return;
      } else {
        await cloud.signIn(email, pass);
      }
      renderHome();
      toast("Signed in");
      syncNow({ firstLogin: true });
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false; btn.textContent = was;
    }
  };
  $("auGo").onclick = submit;
  ["auEmail","auPass"].forEach(id => $(id) && ($(id).onkeydown = e => { if (e.key === "Enter") submit(); }));
  $("auEmail").focus();
}

addEventListener("online",  () => { if (cloud.user) syncNow(); });
addEventListener("offline", () => { cloud.status = "offline"; renderAccountBar(); });
addEventListener("focus",   () => { if (cloud.user && cloud.status !== "syncing") queueSync(); });

(async () => {
  await load();
  renderHome();
  await cloud.init();
  renderAccountBar();
  if (cloud.user) syncNow({ firstLogin: true });
})();

/* ------------------------------------------------------------------
   A small shoal drifting behind the page. Clicking anywhere sends the
   nearby fish darting off, then they settle back to a cruise.

   Deliberately cheap: one canvas, no library, ~16 fish, paused when the
   tab is hidden and skipped entirely for reduced-motion or tiny screens.
   The canvas never takes pointer events — clicks are read from the
   document so nothing in the UI is blocked.
------------------------------------------------------------------ */
(function shoal(){
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  const cv = document.getElementById("sea");
  if (!cv || !cv.getContext) return;
  const cx = cv.getContext("2d", { alpha: true });

  let W = 0, H = 0, dpr = 1, fish = [], raf = null, last = 0;

  const rand = (a,b) => a + Math.random() * (b - a);
  const COUNT = () => Math.max(6, Math.min(18, Math.round(innerWidth * innerHeight / 78000)));

  function palette(){
    const cs = getComputedStyle(document.documentElement);
    return ["c2","c3","c4","c5"].map(k => cs.getPropertyValue("--" + k).trim() || "#6FD0D5");
  }

  function spawn(n){
    const cols = palette();
    fish = Array.from({length:n}, () => {
      const dir = Math.random() < 0.5 ? -1 : 1;
      return {
        x: rand(0, W), y: rand(0, H),
        vx: dir * rand(14, 34), vy: rand(-6, 6),
        len: rand(11, 22),
        col: cols[(Math.random() * cols.length) | 0],
        alpha: rand(0.16, 0.4),
        phase: rand(0, Math.PI * 2),
        wob: rand(1.6, 3.2),
      };
    });
  }

  function resize(){
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (fish.length !== COUNT()) spawn(COUNT());
  }

  /* A fish: teardrop body plus a tail that beats as it swims. */
  function draw(f, t){
    const ang = Math.atan2(f.vy, f.vx);
    const beat = Math.sin(t * f.wob + f.phase);
    cx.save();
    cx.translate(f.x, f.y);
    cx.rotate(ang);
    cx.globalAlpha = f.alpha;
    cx.fillStyle = f.col;

    const L = f.len, Bd = L * 0.42;
    cx.beginPath();
    cx.moveTo(L * 0.5, 0);
    cx.quadraticCurveTo(0, -Bd, -L * 0.42, 0);
    cx.quadraticCurveTo(0, Bd, L * 0.5, 0);
    cx.fill();

    cx.beginPath();                       // tail
    cx.moveTo(-L * 0.38, 0);
    cx.lineTo(-L * 0.72, -Bd * (0.55 + beat * 0.35));
    cx.lineTo(-L * 0.72,  Bd * (0.55 - beat * 0.35));
    cx.closePath();
    cx.fill();
    cx.restore();
  }

  function step(now){
    const t = now / 1000;
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    cx.clearRect(0, 0, W, H);

    for (const f of fish){
      // gentle wander, then ease back toward a cruising speed
      f.vy += Math.sin(t * 0.6 + f.phase) * 6 * dt;
      const sp = Math.hypot(f.vx, f.vy);
      const cruise = 26;
      if (sp > cruise){
        const k = 1 - Math.min(1, (sp - cruise) * 0.9 * dt / sp);
        f.vx *= k; f.vy *= k;
      } else if (sp < cruise * 0.6){
        f.vx *= 1 + 0.6 * dt;
      }
      f.vy *= 0.995;

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      const m = f.len * 2;                // wrap around the edges
      if (f.x < -m) f.x = W + m; else if (f.x > W + m) f.x = -m;
      if (f.y < -m) f.y = H + m; else if (f.y > H + m) f.y = -m;

      draw(f, t);
    }
    raf = requestAnimationFrame(step);
  }

  /** Anything nearby bolts away from the point, hardest at the centre. */
  function scatter(px, py){
    for (const f of fish){
      const dx = f.x - px, dy = f.y - py;
      const d = Math.hypot(dx, dy);
      if (d > 240) continue;
      const push = (1 - d / 240) ** 2 * 460;
      const nx = d < 1 ? Math.random() - 0.5 : dx / d;
      const ny = d < 1 ? Math.random() - 0.5 : dy / d;
      f.vx += nx * push;
      f.vy += ny * push * 0.7;
    }
  }

  const start = () => { if (!raf){ last = performance.now(); raf = requestAnimationFrame(step); } };
  const stop  = () => { if (raf){ cancelAnimationFrame(raf); raf = null; } };

  addEventListener("resize", resize, { passive: true });
  document.addEventListener("click", e => scatter(e.clientX, e.clientY), { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  // the theme toggle changes the palette the fish are drawn from
  new MutationObserver(() => { const c = palette(); fish.forEach(f => f.col = c[(Math.random()*c.length)|0]); })
    .observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });

  resize();
  start();
})();
</script>
</body>
</html>
