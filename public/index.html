/* ---------------- unit test prep ----------------
   Every course deck the owner still has, as one deck, in the order taught.
   It is never stored or synced: it is rebuilt from the topic decks each
   time, so a card removed from a topic is gone from here too, and a star
   set here lands on the topic deck the card came from. */
function prepDeck(){
  const parts = STARTER_DECKS.map(s => S.decks.find(d => d.id === s.id)).filter(Boolean);
  const cards = [], src = [];
  for (const d of parts) for (const c of d.cards) { cards.push(c); src.push(d.id); }
  return { id: PREP_ID, name: "Unit Test Prep", cat: "biology", cards, src, virtual: true };
}

const MOCK_SIZE = 40;

/** A mock test: questions drawn from every topic in proportion to its size,
    with a floor so that even the shortest topic is properly tested. */
function mockQueue(d){
  const groups = new Map();
  d.cards.forEach((_, i) => {
    if (!groups.has(d.src[i])) groups.set(d.src[i], []);
    groups.get(d.src[i]).push(i);
  });
  const keys = [...groups.keys()];
  const sizes = keys.map(k => groups.get(k).length);
  const total = sizes.reduce((a, b) => a + b, 0);
  const n = Math.min(MOCK_SIZE, total);
  const floor = Math.min(4, Math.floor(n / Math.max(1, keys.length)));
  const take = sizes.map(sz => Math.min(sz, floor));
  for (let left = n - take.reduce((a, b) => a + b, 0); left > 0; left--) {
    let best = -1, gap = -Infinity;
    sizes.forEach((sz, i) => {
      if (take[i] >= sz) return;
      const g = sz / total * n - take[i];      // how far below its fair share
      if (g > gap) { gap = g; best = i; }
    });
    if (best < 0) break;
    take[best]++;
  }
  return shuffle(keys.flatMap((k, i) => shuffle(groups.get(k)).slice(0, take[i])));
}

/** "Topics 1 to 4 and the Liver", from whichever course decks are present. */
function topicSpan(list){
  const nums = list.filter(s => !s.minor).map(s => Number(topicNumber(s)));
  const extra = list.filter(s => s.minor).map(s => s.short.replace(/^The /, "the "));
  const run = nums.length > 1 && nums.every((n, i) => !i || n === nums[i - 1] + 1);
  const main = !nums.length ? "" : nums.length === 1 ? `Topic ${nums[0]}`
    : run ? `Topics ${nums[0]} to ${nums[nums.length - 1]}`
    : `Topics ${nums.slice(0, -1).join(", ")} and ${nums[nums.length - 1]}`;
  return [main, ...extra].filter(Boolean).join(" and ");
}

const pctOf = m => Math.round(m.score / m.total * 100);

/** The topic a mock test went worst on, among topics that still exist. */
function weakestTopic(m){
  let worst = null;
  for (const [id, [right, total]] of Object.entries(m.byTopic || {})) {
    const s = courseOf(id);
    if (!s || !total || !S.decks.some(d => d.id === id)) continue;
    const r = right / total;
    if (!worst || r < worst.r || (r === worst.r && total > worst.total)) worst = { s, r, right, total };
  }
  return worst;
}

function daysAgo(iso){
  const d = Math.floor((new Date().setHours(0,0,0,0) - new Date(iso).setHours(0,0,0,0)) / 864e5);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d < 7 ? `${d} days ago`
    : new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/** The last few mock scores as a small line, oldest on the left. */
function sparkline(mocks){
  const pts = mocks.slice(-8).map(pctOf);
  if (pts.length < 2) return "";
  const w = 64, h = 22, step = w / (pts.length - 1);
  const xy = pts.map((p, i) => [Math.round(i * step * 10) / 10, Math.round((h - 2 - p / 100 * (h - 4)) * 10) / 10]);
  const [lx, ly] = xy[xy.length - 1];
  return `<svg class="spark" width="${w + 4}" height="${h}" viewBox="-2 0 ${w + 4} ${h}" aria-hidden="true">
      <polyline points="${xy.map(p => p.join(",")).join(" ")}"/>
      <circle cx="${lx}" cy="${ly}" r="2.6"/></svg>`;
}

/** The red-pen mark a teacher puts on a test, drawn once, slightly off true. */
const INK_RING = `<svg viewBox="0 0 100 76" aria-hidden="true"><path pathLength="100"
  d="M57 5C81 5 96 19 95 37C94 57 75 71 50 71C24 71 5 58 5 38C5 20 22 6 46 5C56 4.6 65 6.5 73 10"/></svg>`;

function prepHTML(){
  const p = prepDeck();
  if (!p.cards.length) return "";
  const topics = STARTER_DECKS.filter(s => p.src.includes(s.id));
  const count = id => p.src.filter(x => x === id).length;
  const mocks = S.mocks || [];
  const last = mocks[mocks.length - 1];
  const n = Math.min(MOCK_SIZE, p.cards.length);

  const band = topics.map(s => `<i style="--tc:var(--${s.color});--n:${count(s.id)}"></i>`).join("");
  const bars = topics.map(s => {
    const pct = lastRun(s.id);
    return `<i style="--tc:var(--${s.color});--n:${count(s.id)};--p:${pct || 0}%" title="${esc(topicName(s))}"></i>`;
  }).join("");
  const legend = topics.map(s => {
    const pct = lastRun(s.id);
    const status = pct === null ? "new" : pct + "%";
    return `<button class="tl${s.minor ? " minor" : ""}" data-deck="${s.id}" style="--tc:var(--${s.color})"
        title="${esc(topicName(s))}" aria-label="${esc(topicName(s))}, ${status}">
        <span class="tn">${topicNumber(s)}</span><span class="tt">${esc(s.short)}</span>
        <span class="tp">${status}</span></button>`;
  }).join("");

  const mark = last
    ? `<div class="mark" title="Your last mock test">${INK_RING}<b>${pctOf(last)}%</b><span>last mock</span></div>`
    : `<div class="mark empty" title="A mock test is ${n} questions">${INK_RING}<b>${n}</b><span>questions</span></div>`;

  let foot;
  if (last) {
    const weak = weakestTopic(last);
    const best = Math.max(...mocks.map(pctOf));
    foot = `<span>Last mock <b>${last.score}/${last.total}</b> ${daysAgo(last.at)}${
      mocks.length > 1 ? ` · best <b>${best}%</b>` : ""}${
      weak && weak.r < 1 ? ` · weakest: <b>${esc(weak.s.short)}</b>` : ""}</span>${sparkline(mocks)}`;
  } else {
    foot = `<span>A mock test draws ${n} questions from every topic and marks it at the end, like the real thing.</span>`;
  }

  return `<section class="prep" aria-labelledby="prepTitle">
      <div class="panel-head">
        <h2 id="prepTitle"><span class="pin">${PIN_SVG}</span>Unit Test Prep</h2>
        <span class="n">${topics.length} topic${topics.length === 1 ? "" : "s"}</span>
        <span class="keep"></span>
      </div>
      <div class="paper">
        <div class="band">${band}</div>
        <div class="paper-top">
          <div class="lede">
            <p class="eyebrow">Biology unit test</p>
            <h3>The whole unit, in one deck</h3>
            <p class="sub">${p.cards.length} questions from ${esc(topicSpan(topics))}. Take a mock test, or work through all of it.</p>
          </div>
          ${mark}
        </div>
        <div class="bars" aria-hidden="true">${bars}</div>
        <div class="topics">${legend}</div>
        <div class="paper-acts">
          <button class="act primary" data-prep="mock">Take a mock test <small>${n} questions</small></button>
          <button class="act" data-prep="quiz">Quiz everything</button>
          <button class="act" data-prep="cards">Flashcards</button>
        </div>
        <div class="paper-foot">${foot}</div>
      </div>
    </section>`;
}

/* ---------------- study ---------------- */
const shuffle = a => { a = a.slice();
  for (let i = a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; };

function buildQueue(idx){
  const q = shuffle(idx);
  if (q.length > 1 && q[0] === lastSeen) [q[0],q[q.length-1]] = [q[q.length-1],q[0]];
  return q;
}

/* Each question of a quiz or mock test as it was asked: the prompt, the right
   answer, and the pick, which stays null if it was skipped. Nothing is marked
   until the end, the way a test on paper is. */
let picks = [], mockStart = 0;
const answeredCount = () => picks.filter(p => p && p.pick !== null).length;

/** Which deck a card in the current run belongs to: its topic, in Unit Test Prep. */
const ownerOf = i => deck.virtual ? deck.src[i] : deck.id;
/** A mock test always asks the question and offers answers, whatever ⇄ says. */
const flipped = () => reverse && mode !== "mock";

/** The study screen takes the colour of whatever is being studied. */
function setAccent(id, cat){
  const s = courseOf(id);
  const color = id === PREP_ID ? "c4" : s ? s.color : (catById(cat) || {}).color;
  document.documentElement.style.setProperty("--accent", color ? `var(--${color})` : "var(--bio)");
}

/** The small label on a card: the topic for course cards, else the category. */
function cardLabel(i){
  const s = courseOf(ownerOf(i));
  return s ? topicName(s) : catName(deck.cat);
}

function openDeck(id, only, m){
  assemble();
  deck = id === PREP_ID ? prepDeck() : DECKS.find(d => d.id === id);
  if (!deck || !deck.cards.length) { renderHome(); return toast("That deck has no cards yet"); }
  if (m) mode = m;
  if (mode === "mock" && !deck.virtual) mode = "quiz";
  missed = []; quizMissed = []; picks = []; mockStart = Date.now();
  queue = mode === "mock" && !only ? mockQueue(deck) : buildQueue(only || deck.cards.map((_,i)=>i));
  pos = 0;
  setAccent(deck.id, deck.cat);
  $("deckname").textContent = deck.name;
  $("segMock").classList.toggle("hide", !deck.virtual);
  $("btnAddCard").classList.toggle("hide", !!deck.virtual);
  showScreen("study");
  $("finish").classList.add("hide");
  touchStreak();
  renderRun();
}

function renderRun(){
  const quiz = mode === "quiz" || mode === "mock";
  $("cardWrap").classList.toggle("hide", quiz);
  $("quizWrap").classList.toggle("hide", !quiz);
  $("btnStar").classList.toggle("hide", quiz);
  $("btnFlipMode").classList.toggle("hide", mode === "mock");
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  quiz ? showQuestion() : showCard();
}

function showCard(){
  const i = queue[pos]; lastSeen = i;
  const c = deck.cards[i];
  if (deck.virtual) setAccent(ownerOf(i));
  const front = reverse ? c[1] : c[0], back = reverse ? c[0] : c[1];
  const card = $("card");
  card.classList.remove("flipped","in","exit-left","exit-right");
  void card.offsetWidth;
  card.classList.add("in");
  $("q").textContent = front;
  $("a").textContent = back;
  /* Safe in both directions: the explanation sits on the back face, which is
     only revealed once you have committed to an answer. */
  const why = cardWhy(c);
  $("why").textContent = why;
  $("why").classList.toggle("hide", !why);
  $("frontLabel").textContent = reverse ? "Answer" : cardLabel(i);
  $("backLabel").textContent = reverse ? "Which question?" : "Answer";
  $("count").textContent = `Card ${pos+1} of ${queue.length}`;
  $("tag").textContent = missed.length ? `${missed.length} to review` : "shuffled";
  $("fill").style.width = (pos/queue.length*100)+"%";
  const starred = (S.starred[ownerOf(i)]||[]).includes(cardId(c));
  $("btnStar").className = "star" + (starred ? " on" : "");
  $("btnStar").textContent = starred ? "★ Starred" : "☆ Star";
}

function advance(gotIt){
  const card = $("card");
  card.classList.add(gotIt ? "exit-right" : "exit-left");
  if (!gotIt) missed.push(queue[pos]);
  setTimeout(() => {
    if (pos < queue.length-1){ pos++; showCard(); } else finish();
  }, 200);
}

/* ---------------- quiz ---------------- */
let lastSets = {}, lastCorrectPos = -1;

const words = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g," ").split(" ").filter(w => w.length > 3);

function similarity(cand, correct, q){
  let s = 0;
  const cw = new Set(words(correct)), qw = new Set(words(q));
  words(cand).forEach(w => { if (cw.has(w)) s += 3; if (qw.has(w)) s += 2; });
  s += 3 * Math.min(cand.length, correct.length) / Math.max(cand.length, correct.length);
  if (/\d/.test(cand) === /\d/.test(correct)) s += 1;
  if ((cand.split(",").length > 1) === (correct.split(",").length > 1)) s += 1;
  return s;
}

function pickDistractors(i, correct, prompt){
  const card = deck.cards[i];
  const group = card[2];
  const rev = flipped();
  const seen = new Set([correct]);
  const cands = [];

  // 1. wrong answers written for this exact question (forward direction only)
  if (!rev && Array.isArray(card[3])) card[3].forEach(text => {
    if (seen.has(text)) return;
    seen.add(text);
    cands.push({ text, rank: 2, s: 0 });
  });

  // 2. answers from the same category, then whatever is closest in wording and shape
  deck.cards.forEach((x,n) => {
    if (n === i) return;
    const text = rev ? x[0] : x[1];
    if (seen.has(text)) return;
    seen.add(text);
    cands.push({ text, rank: (x[2] && x[2] === group) ? 1 : 0, s: similarity(text, correct, prompt) });
  });

  const ranked = cands.sort((a,b) => (b.rank - a.rank) || (b.s - a.s));
  const authored = ranked.filter(x => x.rank === 2).length;
  const pool = ranked.slice(0, authored >= 4 ? authored : Math.max(6, Math.min(8, ranked.length)));

  // rotate: whatever was offered for this card last time goes to the back of the line
  const key = deck.id + ":" + i + (rev ? ":r" : "");
  const prev = lastSets[key] || [];
  const chosen = shuffle(pool)
    .sort((a,b) => (prev.includes(a.text) ? 1 : 0) - (prev.includes(b.text) ? 1 : 0))
    .slice(0,3).map(x => x.text);
  lastSets[key] = chosen;
  return chosen;
}

function showQuestion(){
  const i = queue[pos]; lastSeen = i;
  const c = deck.cards[i];
  const rev = flipped();
  if (deck.virtual) setAccent(ownerOf(i));
  const prompt = rev ? c[1] : c[0];
  curCorrect = rev ? c[0] : c[1];
  /* recorded as asked, so swapping direction mid-quiz cannot mark a question
     against the wrong answer; asking it again clears an earlier pick */
  picks[pos] = { prompt, correct: curCorrect, pick: null };

  curOpts = shuffle(pickDistractors(i, curCorrect, prompt).concat([curCorrect]));
  // don't let the right answer sit in the same slot twice in a row
  const at = curOpts.indexOf(curCorrect);
  if (curOpts.length > 1 && at === lastCorrectPos){
    const to = (at + 1 + Math.floor(Math.random() * (curOpts.length - 1))) % curOpts.length;
    [curOpts[at], curOpts[to]] = [curOpts[to], curOpts[at]];
  }
  lastCorrectPos = curOpts.indexOf(curCorrect);

  const qc = $("qcard");
  qc.style.animation = "none"; void qc.offsetWidth; qc.style.animation = "";
  $("qq").textContent = prompt;
  $("qLabel").textContent = mode === "mock" ? "Mock test · marked at the end"
    : rev ? "Which question fits?" : deck.virtual ? cardLabel(i) : "Quiz · marked at the end";
  $("opts").innerHTML = curOpts.map((t,n) =>
    `<button class="opt" data-i="${n}" aria-pressed="false" style="animation-delay:${n*55}ms"><span class="k">${n+1}</span>${esc(t)}</button>`).join("");
  document.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => answerQuiz(+b.dataset.i));
  $("btnNextQ").classList.add("hide");
  $("btnNextQ").textContent = "Next question";
  $("btnSkip").classList.remove("hide");
  $("count").textContent = `Question ${pos+1} of ${queue.length}`;
  $("tag").textContent = `${answeredCount()} answered`;
  $("fill").style.width = (pos/queue.length*100)+"%";
}

/* A quiz is a test: nothing is marked until the end, and a choice can be
   changed until you move on, the way you can rub out an answer on paper. The
   right answers, and why, come with the results. */
function answerQuiz(n){
  if (!curOpts[n] || !picks[pos]) return;
  picks[pos].pick = curOpts[n];
  document.querySelectorAll("#opts .opt").forEach((b,k) => {
    b.classList.toggle("picked", k === n);
    b.setAttribute("aria-pressed", String(k === n));
  });
  $("btnSkip").classList.add("hide");
  $("btnNextQ").classList.remove("hide");
  $("btnNextQ").textContent = pos < queue.length - 1 ? "Next question"
    : mode === "mock" ? "Finish the test" : "Finish the quiz";
  $("tag").textContent = `${answeredCount()} answered`;
}

function nextQuestion(){
  if (pos < queue.length-1){ pos++; showQuestion(); } else finish();
}

/** Every question of the run, marked. A question never reached or skipped is wrong. */
function marked(){
  return queue.map((i, k) => {
    const p = picks[k] || { prompt: deck.cards[i][0], correct: deck.cards[i][1], pick: null };
    return { i, prompt: p.prompt, correct: p.correct, pick: p.pick, right: p.pick !== null && p.pick === p.correct };
  });
}

/** The questions to go back over: the pick struck through, the right answer
    highlighted, and why. */
function missRows(rows){
  return rows.map(({ i, prompt, correct, pick }) => {
    const s = courseOf(ownerOf(i)), why = cardWhy(deck.cards[i]);
    return `<div class="mrow"${s ? ` style="--tc:var(--${s.color})"` : ""}>
        ${deck.virtual && s ? `<small>${esc(topicName(s))}</small>` : ""}
        <span>${esc(prompt)}</span>
        ${pick !== null ? `<s class="you">${esc(pick)}</s>` : `<s class="you skipped">Skipped</s>`}
        <em class="ans"><mark>${esc(correct)}</mark></em>
        ${why ? `<p class="whyline">${esc(why)}</p>` : ""}
      </div>`;
  }).join("");
}

/** Right and total per topic, for a run through Unit Test Prep. */
function tally(rows){
  const by = {};
  for (const { i, right } of rows) {
    const t = deck.src[i];
    const cell = by[t] = by[t] || [0, 0];
    cell[1]++;
    if (right) cell[0]++;
  }
  return by;
}

/** One bar per topic, worst first, so the eye lands on what needs work. */
function breakdownHTML(by){
  const rows = Object.entries(by)
    .map(([id, [right, total]]) => ({ s: courseOf(id), right, total }))
    .filter(r => r.s)
    /* same order as weakestTopic: worst share first, the bigger sample breaking a tie */
    .sort((a, b) => a.right / a.total - b.right / b.total || b.total - a.total ||
                    courseRank(a.s.id) - courseRank(b.s.id));
  return rows.map(({ s, right, total }) => `
      <div class="brow" style="--tc:var(--${s.color})">
        <span class="tn${s.minor ? " minor" : ""}">${topicNumber(s)}</span>
        <span class="lbl">${esc(s.short)}</span>
        <span class="val">${right}/${total}</span>
        <span class="meter"><i style="--w:${Math.round(right / total * 100)}%"></i></span>
      </div>`).join("");
}

function verdict(pct){
  return pct >= 90 ? "Ready for the test" : pct >= 75 ? "Nearly there"
    : pct >= 55 ? "Getting there" : "Keep going";
}

async function finish(){
  if (mode === "mock") return finishMock();
  if (deck.virtual) setAccent(PREP_ID);
  const quiz = mode === "quiz";
  const rows = quiz ? marked() : [];
  if (quiz) quizMissed = rows.filter(r => !r.right).map(r => r.i);
  const miss = quiz ? quizMissed : missed;
  const total = queue.length;
  const known = total - miss.length;
  $("fill").style.width = "100%";
  $("cardWrap").classList.add("hide");
  $("quizWrap").classList.add("hide");
  $("finish").classList.remove("hide");
  $("finishMark").classList.add("hide");
  $("score").classList.remove("hide");
  $("score").textContent = quiz ? `${Math.round(known/total*100)}%` : `${known}/${total}`;
  $("finishTitle").textContent = miss.length
    ? (quiz ? `${known} of ${total} correct` : "End of the deck")
    : (quiz ? "Perfect run" : "Full deck cleared");
  $("finishText").textContent = miss.length
    ? `${miss.length} ${quiz ? "question" : "card"}${miss.length===1?"":"s"} to go back over.`
    : (quiz ? "Every question right. Try it with the answers flipped." : "Every card marked as known.");
  const missSet = new Set(miss);
  $("breakdown").innerHTML = deck.virtual
    ? breakdownHTML(tally(queue.map(i => ({ i, right: !missSet.has(i) }))))
    : "";
  $("missedList").innerHTML = quiz && miss.length
    ? `<h4 class="mhead">Questions to go back over</h4>` + missRows(rows.filter(r => !r.right))
    : "";
  $("btnRestart").textContent = "Start over";
  $("btnMissed").textContent = quiz ? "Quiz the misses" : "Review the misses";
  $("btnMissed").classList.toggle("hide", miss.length === 0);
  const key = scoreKey(deck.id);
  S.progress[key] = { known, total };
  if (quiz){
    const pct = Math.round(known/total*100);
    S.best = S.best || {};
    if (pct > (S.best[key] || 0)){ S.best[key] = pct; if (total > 3) toast("New best quiz score"); }
  }
  touchState();
  await save();
}

/**
 * The end of a mock test: the mark, how each topic went, what to do next,
 * and every question that was missed, with the right answer and why.
 */
async function finishMock(){
  const rows = marked();
  const total = rows.length, score = rows.filter(r => r.right).length;
  const pct = Math.round(score / total * 100);
  const byTopic = tally(rows);
  const mins = Math.max(1, Math.round((Date.now() - mockStart) / 60000));
  const result = { at: nowISO(), score, total, byTopic };
  S.mocks = (S.mocks || []).concat([result]).slice(-20);
  S.progress[PREP_ID] = { known: score, total };
  setAccent(PREP_ID);

  $("fill").style.width = "100%";
  $("quizWrap").classList.add("hide");
  $("finish").classList.remove("hide");
  $("score").classList.add("hide");
  $("finishMark").classList.remove("hide");
  $("finishMark").innerHTML = `${INK_RING}<b>${pct}%</b>`;
  $("finishTitle").textContent = verdict(pct);
  $("finishText").textContent =
    `${score} of ${total} correct, in ${mins} minute${mins === 1 ? "" : "s"}.`;

  const weak = weakestTopic(result);
  $("breakdown").innerHTML = breakdownHTML(byTopic) + (weak && weak.r < 1 ? `
      <div class="weak" style="--tc:var(--${weak.s.color})">
        <p>Your weakest topic was <b>${esc(topicName(weak.s))}</b>, ${weak.right} of ${weak.total}.</p>
        <button class="act" id="btnWeak">Quiz ${esc(weak.s.short)}</button>
      </div>` : "");
  if (weak && weak.r < 1) $("btnWeak").onclick = () => openDeck(weak.s.id, null, "quiz");

  const wrong = rows.filter(r => !r.right);
  $("missedList").innerHTML = wrong.length
    ? `<h4 class="mhead">Questions to go back over</h4>` + missRows(wrong) : "";

  quizMissed = wrong.map(r => r.i);
  $("btnRestart").textContent = "New mock test";
  $("btnMissed").textContent = "Quiz the misses";
  $("btnMissed").classList.toggle("hide", !wrong.length);
  touchState();
  await save();
}

function toggleStar(){
  const i = queue[pos];
  const owner = ownerOf(i), id = cardId(deck.cards[i]);
  const arr = S.starred[owner] = S.starred[owner] || [];
  const at = arr.indexOf(id);
  if (at >= 0) arr.splice(at,1); else arr.push(id);
  touchState(); save(); showCard();
}

/* ---------------- modals ---------------- */
function modal(html, onOk){
  const host = $("modalHost");
  host.innerHTML = `<div class="scrim"><div class="modal">${html}
    <div class="row"><button class="act" id="mCancel">Cancel</button>
    <button class="act primary" id="mOk">Save</button></div></div></div>`;
  $("mCancel").onclick = () => host.innerHTML = "";
  $("mOk").onclick = () => { if (onOk() !== false) host.innerHTML = ""; };
  host.querySelector(".scrim").onclick = e => { if (e.target.classList.contains("scrim")) host.innerHTML = ""; };
  setTimeout(() => host.querySelector("input,textarea")?.focus(), 60);
}

function newDeckModal(catId){
  modal(`<h3>New deck</h3>
    <label for="dn">Deck name</label><input id="dn" placeholder="e.g. Unit 2 — Quadratics">
    <label for="dnc">Category</label><select id="dnc">${categoryOptions(catId)}</select>`,
    () => {
      const name = $("dn").value.trim();
      if (!name) return false;
      const nd = { id: uid("d"), cat: $("dnc").value || catId, name, note:"", cards:[], updated_at: nowISO() };
      S.decks.push(nd);
      save(); queueSync(); renderHome(); toast("Deck created");
    });
}

function addCardModal(){
  modal(`<h3>Add a card</h3>
    <label for="cq">Question</label><textarea id="cq"></textarea>
    <label for="ca">Answer</label><textarea id="ca"></textarea>
    <label for="cw">Why is that the answer? (optional)</label><textarea id="cw"></textarea>`,
    () => {
      const q = $("cq").value.trim(), a = $("ca").value.trim();
      if (!q || !a) return false;
      S.decks.find(d => d.id === deck.id).cards.push(
        withId([q, a, "concept", null, null, $("cw").value.trim() || null]));
      touchDeck(deck.id);
      save(); assemble();
      deck = DECKS.find(d => d.id === deck.id);
      queue.push(deck.cards.length-1);
      $("count").textContent = `Card ${pos+1} of ${queue.length}`;
      toast("Card added to this run");
    });
}

/* ---------------- events ---------------- */
$("card").onclick = () => $("card").classList.toggle("flipped");

/* The entrance animation must not outlive itself. While .in is present its
   fill-mode pins transform to the final keyframe, which silently beats
   .flipped and the card never turns over. */
$("card").addEventListener("animationend", e => {
  if (e.animationName === "deal") $("card").classList.remove("in");
});
$("card").addEventListener("animationend", e => {
  if (e.animationName === "pop") $("card").classList.remove("in");
});
$("btnGot").onclick = () => advance(true);
$("btnAgain").onclick = () => advance(false);
$("btnPrev").onclick = () => { if (pos>0){ pos--; showCard(); } };
$("btnShuffle").onclick = () => {
  queue = buildQueue(queue); pos = 0; missed = []; quizMissed = []; picks = [];
  renderRun(); toast(mode === "quiz" ? "New question order" : "Deck reshuffled");
};

/* ------------------------------------------------------------------
   SCAN NOTES — photo -> Gemini -> reviewable deck
   The API key lives on the server, never here.
------------------------------------------------------------------ */

/* Same origin on Vercel. The GitHub Pages mirror has no /api, so point it
   at the Vercel deployment — set this once after your first deploy. */
const VERCEL_API = "";           // e.g. "https://flashcards-hackcroydon.vercel.app"
const API_BASE = /github\.io$/.test(location.hostname) ? VERCEL_API : "";

let draft = null;   // { deckName, subject, cards, keep, truncated, partial }

/* Phone photos are 4000px and 6 MB. Shrink before upload: Gemini reads text
   fine at this size and it keeps us under the request limit. */
function downscale(file, maxDim = 1600){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);   // flatten any alpha
      cx.drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`Could not read ${file.name}.`)); };
    img.src = url;
  });
}

function showScreen(id){
  ["home","study","review"].forEach(s => $(s).classList.toggle("hide", s !== id));
  window.scrollTo(0, 0);
}

/* Everything the scan learned about itself, for the error screen and console.
   Rebuilt per scan so it never shows stale numbers from a previous attempt. */
let diag = {};

function dbg(step, detail){
  diag[step] = detail;
  console.log(`[scan] ${step}:`, detail);
}

function diagText(){
  return Object.entries(diag)
    .map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`)
    .join("\n");
}

function scanError(msg){
  showScreen("review");
  $("reviewTitle").textContent = "Scan failed";
  const report = diagText();
  console.warn("[scan] FAILED —", msg, "\n" + report);
  $("reviewBody").innerHTML = `<div class="done">
      <h3>That didn't work</h3>

        <button class="act primary" id="seRetry">Try another photo</button>
      </div>
      <div class="row"><button class="act ghost" id="seDiag">Show technical details</button></div>
      <pre class="diag hide" id="diagBox">${esc(report)}</pre>
      <div class="row hide" id="diagRow">
        <button class="act ghost" id="seCopy">Copy details</button>
        <button class="act ghost" id="seHealth">Check the server</button>
      </div>
    </div>`;
  $("seHome").onclick = () => renderHome();
  $("seRetry").onclick = () => $("scanInput").click();
  $("seDiag").onclick = () => {

    $("diagRow").classList.toggle("hide", !open);
    $("seDiag").textContent = open ? "Hide technical details" : "Show technical details";
  };
  $("seCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(report); toast("Details copied"); }
    catch { toast("Select the text and copy it"); }
  };
  $("seHealth").onclick = () => window.open(`${API_BASE}/api/health?probe=1`, "_blank");
}

/* One request can only carry a few pages: Vercel caps the body at 4.5 MB and
   Gemini has an output ceiling, so a whole note set has to go up in batches.
   Each batch is one Gemini request, and the free tier allows ~20 a day, which
   is why the page count is capped and the cost is stated up front. */
const PAGES_PER_BATCH = 4;
const MAX_PAGES = 24;

/* ---------------- scan progress ----------------
   A scan can take a minute across several batches, so it has to show what it
   is doing: which pages, how long it has been waiting, and — when something
   goes wrong — that it is trying again rather than silently stalling. */

const SCAN_TIMEOUT_MS = Number(localStorage.getItem("scanTimeoutMs")) || 90_000;
const SCAN_RETRIES = 2;            // attempts after the first, per batch
const RETRY_BACKOFF_MS = [3000, 8000];

/** Small thumbnails so you can see which pages you actually picked. */
function thumbnail(file, max = 132){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * s));
      cv.height = Math.max(1, Math.round(img.height * s));
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* Live state for the working screen, so updates don't rebuild the whole DOM
   and restart the CSS animations underneath. */
const scanUI = {
  thumbs: [],          // { src, name, state: pending|active|done|failed }
  started: 0,
  tick: null,
  title: "",
  note: "",
  retry: "",

  open(thumbs){
    this.thumbs = thumbs;
    this.started = Date.now();
    this.title = "Reading your notes…";
    this.note = "";
    this.retry = "";
    showScreen("review");
    $("reviewTitle").textContent = "Scanning";
    $("reviewBody").innerHTML = `
      <div class="scanning">
        <div class="pages" id="scanPages">${thumbs.map((t,i) => `
          <figure class="pg pending" data-pg="${i}">
            ${t.src ? `<img src="${t.src}" alt="">` : `<span class="noimg">?</span>`}
            <figcaption>${i+1}</figcaption>
          </figure>`).join("")}</div>

        <div class="scanbar"><i id="scanFill" style="width:0%"></i></div>

        <div class="scanhead">
          <span class="orbit small"><i></i><i></i></span>
          <span>
            <b id="scanTitle">Reading your notes…</b>
            <span id="scanNote"></span>
          </span>
          <span class="waited" id="scanWaited">0s</span>
        </div>

        <p class="retrying hide" id="scanRetry"></p>
        <div class="row"><button class="act ghost" id="scanCancel">Cancel</button></div>
      </div>`;

    $("scanCancel").onclick = () => { scanUI.cancelled = true; scanUI.close(); renderHome(); };
    this.cancelled = false;
    clearInterval(this.tick);
    this.tick = setInterval(() => {
      const el = $("scanWaited");
      if (!el) return clearInterval(this.tick);
      const s = Math.round((Date.now() - this.started) / 1000);
      el.textContent = s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${s%60}s`;
      // once it is running long, say so rather than looking stuck
      el.classList.toggle("slow", s > 25);
    }, 250);
  },

  set(title, note){
    this.title = title; this.note = note || "";
    if ($("scanTitle")) $("scanTitle").textContent = title;
    if ($("scanNote")) $("scanNote").textContent = this.note;
  },

  /** Mark a range of pages, and move the bar. */
  mark(from, to, state){
    for (let i = from; i <= to; i++) {
      const el = document.querySelector(`[data-pg="${i}"]`);
      if (el) el.className = "pg " + state;
    }
    const done = document.querySelectorAll(".pg.done").length;
    if ($("scanFill")) $("scanFill").style.width = `${Math.round(done / this.thumbs.length * 100)}%`;
  },

  sayRetry(text){
    this.retry = text;
    const el = $("scanRetry");
    if (!el) return;
    el.textContent = text;
    el.classList.toggle("hide", !text);
  },

  close(){ clearInterval(this.tick); this.tick = null; },
};

/** A countdown the user can watch, rather than a dead pause. */
async function waitVisibly(ms, label){
  const until = Date.now() + ms;
  while (Date.now() < until) {
    if (scanUI.cancelled) return;
    const left = Math.ceil((until - Date.now()) / 1000);
    scanUI.sayRetry(`${label} Retrying in ${left}s…`);
    await new Promise(r => setTimeout(r, 250));
  }
  scanUI.sayRetry("");
}

/**
 * Send one batch, with a hard timeout so a hung request cannot stall the whole
 * scan forever. Returns {ok, cards, ...} or {ok:false, error, retryable}.
 */
async function sendBatch(images){
  const payload = JSON.stringify({ images });
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), SCAN_TIMEOUT_MS);
  let res, raw = "", data = null;
  try {
    const headers = { "Content-Type": "application/json" };
    const token = cloud.user ? await cloud.accessToken() : null;
    if (token) headers.Authorization = `Bearer ${token}`;
    res = await fetch(`${API_BASE}/api/extract`,
      { method: "POST", headers, body: payload, signal: ctl.signal });
    raw = await res.text();
    try { data = JSON.parse(raw); } catch {}
  } catch (e) {
    if (e?.name === "AbortError") {
      return { ok:false, timedOut:true, retryable:true,
        error:`That took longer than ${Math.round(SCAN_TIMEOUT_MS/1000)} seconds, so it was stopped.` };
    }
    return { ok:false, retryable:true,
      error:"Couldn't reach the scanning service. If you're running this locally, make sure \"npm run dev\" is still running in your terminal." };
  } finally {
    clearTimeout(timer);
  }

  if (res.status === 404) {
    return { ok:false, status:404, retryable:false,
      error:"The scanning service isn't running at this address. If this is GitHub Pages, set VERCEL_API in index.html to your Vercel URL." };
  }
  if (!res.ok || !data || !Array.isArray(data.cards)) {
    return { ok:false, status:res.status,
      // the server says whether another go is worth it; retrying something
      // that will fail again only burns the daily Gemini quota
      retryable: data ? !!data.retryable : res.status >= 500,
      error:(data && data.error) || `The server returned an error (HTTP ${res.status}).` };
  }
  return { ok:true, ...data };
}

/** One batch, with retries. Reports each attempt so nothing looks stalled. */
async function sendBatchWithRetry(images, { from, to, label }){
  for (let attempt = 0; attempt <= SCAN_RETRIES; attempt++) {
    if (scanUI.cancelled) return { ok:false, cancelled:true, error:"Cancelled." };
    if (attempt > 0) scanUI.set(label, `Attempt ${attempt + 1} of ${SCAN_RETRIES + 1}`);

    const out = await sendBatch(images);
    if (out.ok) return out;
    if (!out.retryable || attempt === SCAN_RETRIES) return out;

    scanUI.mark(from, to, "failed");
    await waitVisibly(RETRY_BACKOFF_MS[attempt] || 8000,
      out.timedOut ? "That attempt timed out." : `That attempt failed: ${out.error}`);
    if (scanUI.cancelled) return { ok:false, cancelled:true, error:"Cancelled." };
    scanUI.mark(from, to, "active");
  }
  return { ok:false, error:"Gave up after several attempts.", retryable:false };
}

async function runScan(files){
  const t0 = Date.now();
  diag = {};
  dbg("page", `${location.protocol}//${location.host || "(none)"}${location.pathname}`);
  dbg("endpoint", `${API_BASE || location.origin}/api/extract`);
  dbg("files", Array.from(files).map(f => `${f.name} ${f.type||"?"} ${Math.round(f.size/1024)}KB`));

  if (location.protocol === "file:") {
    return scanError(
      "This page was opened as a file, so there's no server to read your notes. " +
      "Run \"npm run dev\" in the project folder and open http://localhost:3000 instead, " +
      "or use the deployed site."
    );
  }

  const pics = Array.from(files).filter(f => f.type.startsWith("image/"));
  if (!pics.length) return scanError("Those weren't image files. Use a photo or screenshot of your notes.");
  if (pics.length > MAX_PAGES) {
    return scanError(`That's ${pics.length} pages. ${MAX_PAGES} at a time is the limit — scan the rest as a second batch and add them to the same deck.`);
  }

  const batches = [];
  for (let i = 0; i < pics.length; i += PAGES_PER_BATCH) batches.push(pics.slice(i, i + PAGES_PER_BATCH));
  dbg("batches", `${pics.length} page(s) in ${batches.length} batch(es) of up to ${PAGES_PER_BATCH}`);

  /* Show the pages first, so you can see what you actually picked before
     waiting on anything. */
  const thumbs = await Promise.all(pics.map(async f => ({ src: await thumbnail(f), name: f.name })));
  scanUI.open(thumbs);

  const all = [];
  const seen = new Set();
  let deckName = null, subject = null, truncated = false, failure = null;

  for (let b = 0; b < batches.length; b++) {
    if (scanUI.cancelled) { failure = "Cancelled."; break; }
    const from = b * PAGES_PER_BATCH + 1;
    const to = from + batches[b].length - 1;
    const label = batches.length === 1 ? "Reading your notes…" : `Reading pages ${from}–${to}…`;
    scanUI.mark(from - 1, to - 1, "active");
    scanUI.set(label, batches.length === 1
      ? `${pics.length} page${pics.length===1?"":"s"}`
      : `Batch ${b+1} of ${batches.length}${all.length ? ` · ${all.length} cards so far` : ""}`);

    /* Shrink until this batch fits the request budget. */
    const budget = 3 * 1024 * 1024;
    let images = null;
    try {
      for (const dim of [1600, 1300, 1100]) {
        images = await Promise.all(batches[b].map(f => downscale(f, dim)));
        const bytes = images.reduce((n,d) => n + d.length * 0.75, 0);
        if (b === 0) dbg("downscale", `${dim}px -> ${(bytes/1048576).toFixed(2)}MB`);
        if (bytes < budget) break;
      }
    } catch (e) {
      dbg("downscaleError", e.message);
      failure = e.message; scanUI.mark(from - 1, to - 1, "failed"); break;
    }
    if (images.reduce((n,d) => n + d.length * 0.75, 0) >= budget) {
      failure = `Pages ${from}–${to} are too large to send together. Try photographing them at a lower resolution.`;
      break;
    }

    const out = await sendBatchWithRetry(images, { from: from - 1, to: to - 1, label });
    dbg(`batch${b+1}`, out.ok ? `${out.cards.length} cards via ${out.model || "?"}` : `failed: ${out.error}`);

    if (!out.ok) { failure = out.error; scanUI.mark(from - 1, to - 1, "failed"); break; }
    scanUI.mark(from - 1, to - 1, "done");

    deckName = deckName || out.deckName;
    subject = subject || out.subject;
    truncated = truncated || !!out.truncated;

    // Pages often restate the previous page's heading, so drop repeats.
    for (const c of out.cards) {
      const k = String(c[0]).trim().toLowerCase();
      if (seen.has(k)) continue;
      seen.add(k); all.push(c);
    }
  }

  scanUI.close();
  dbg("total", `${all.length} cards from ${batches.length} batch(es) in ${((Date.now()-t0)/1000).toFixed(1)}s`);

  /* A later batch failing shouldn't throw away the earlier ones. */
  if (!all.length) return scanError(failure || "No cards were found in those pages.");

  draft = {
    deckName: deckName || "Scanned notes",
    subject: subject === "math" ? "math" : "biology",
    cards: all,
    keep: all.map(() => true),
    truncated,
    partial: failure ? `Pages after ${all.length ? "the ones below" : "this"} couldn't be read: ${failure}` : null,
  };
  renderReview();
}

function renderReview(){
  showScreen("review");
  $("reviewTitle").textContent = "Check the cards";
  const kept = draft.keep.filter(Boolean).length;

  const rows = draft.cards.map((c,i) => {
    const thin = !Array.isArray(c[3]) || c[3].length < 4;
    return `<div class="rcard${draft.keep[i] ? "" : " off"}" data-i="${i}" style="animation-delay:${Math.min(i,12)*35}ms">
        <div class="top">
          <button class="tick" data-tick="${i}" aria-label="Include this card">✓</button>
          <div class="body">
            <p class="q">${esc(c[0])}</p>
            <p class="a">${esc(c[1])}</p>
            ${c[5] ? `<p class="whyline">${esc(c[5])}</p>` : ""}
            <span class="tag">${esc(c[2] || "concept")}${thin ? " · few options" : ""}</span>
          </div>
          <button class="edit" data-edit="${i}">Edit</button>
        </div>
      </div>`;
  }).join("");

  $("reviewBody").innerHTML = `
    <div class="rhead">
      <h3>${draft.cards.length} card${draft.cards.length===1?"":"s"} from your notes</h3>
      <p class="sub">Gemini can misread handwriting. Skim these before you save — untick anything wrong, tap Edit to fix it.</p>
      <label for="rdest">Where do these go?</label>
      <select id="rdest">
        <option value="__new">Create a new deck</option>
        ${deckOptions()}
      </select>
      <div id="rnew">
        <div class="pair">
          <div>
            <label for="rdn">Deck name</label>
            <input id="rdn" value="${esc(draft.deckName)}" maxlength="60">
          </div>
          <div>
            <label for="rsub">Category</label>
            <select id="rsub">${categoryOptions(guessCategory(draft.subject))}</select>
          </div>
        </div>
      </div>
      <p class="sub hide" id="rappend"></p>
    </div>
    ${draft.partial ? `<div class="rwarn">Some pages could not be read, so this is only part of the set. What was read is below. ${esc(draft.partial)}</div>` : ""}
    ${draft.truncated ? `<div class="rwarn">These notes were long and Gemini ran out of room, so the last few facts may be missing. Scan the rest as a second deck.</div>` : ""}
    <p class="rcount" id="rcount">${kept} of ${draft.cards.length} selected</p>
    ${rows}
    <div class="rfoot">
      <div class="row">
        <button class="act" id="rCancel">Discard</button>
        <button class="act primary" id="rSave">Save deck</button>
      </div>
    </div>`;

  $("reviewBody").querySelectorAll("[data-tick]").forEach(b => b.onclick = () => {
    const i = +b.dataset.tick;
    draft.keep[i] = !draft.keep[i];
    b.closest(".rcard").classList.toggle("off", !draft.keep[i]);
    $("rcount").textContent = `${draft.keep.filter(Boolean).length} of ${draft.cards.length} selected`;
  });

  $("reviewBody").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editDraftCard(+b.dataset.edit));

  const dest = $("rdest");
  const syncDest = () => {
    const isNew = dest.value === "__new";
    $("rnew").classList.toggle("hide", !isNew);
    $("rappend").classList.toggle("hide", isNew);
    if (!isNew) {
      const d = S.decks.find(x => x.id === dest.value);
      $("rappend").textContent = d
        ? `These cards will be added to "${d.name}", which has ${d.cards.length} card${d.cards.length===1?"":"s"} already. Anything already in the deck is skipped.`
        : "";
    }
    $("rSave").textContent = isNew ? "Save deck" : "Add to deck";
  };
  dest.onchange = syncDest;
  syncDest();

  $("rCancel").onclick = () => { draft = null; renderHome(); };
  $("rSave").onclick = saveDraft;
}

function editDraftCard(i){
  const c = draft.cards[i];
  modal(`<h3>Edit card</h3>
    <label for="eq">Question</label><textarea id="eq">${esc(c[0])}</textarea>
    <label for="ea">Answer</label><textarea id="ea">${esc(c[1])}</textarea>
    <label for="ew">Why is that the answer?</label><textarea id="ew">${esc(c[5] || "")}</textarea>`,
    () => {
      const q = $("eq").value.trim(), a = $("ea").value.trim();
      if (!q || !a) return false;
      c[5] = $("ew").value.trim() || null;
      // Answer changed, so the old wrong options may no longer be wrong.
      if (a !== c[1] && Array.isArray(c[3])) c[3] = c[3].filter(d => d.toLowerCase() !== a.toLowerCase());
      c[0] = q; c[1] = a;
      draft.keep[i] = true;
      renderReview();
    });
}

function saveDraft(){
  const cards = draft.cards.filter((_,i) => draft.keep[i]);
  if (!cards.length) return toast("Tick at least one card to save");

  const dest = $("rdest").value;

  if (dest !== "__new") {
    const d = S.decks.find(x => x.id === dest);
    if (!d) return toast("That deck no longer exists");

    /* Re-scanning a page that overlaps one you already did is the easy way to
       end up with the same card twice, so match on the question and skip. */
    const seen = new Set(d.cards.map(c => c[0].trim().toLowerCase()));
    const fresh = cards.filter(c => !seen.has(c[0].trim().toLowerCase()));
    const skipped = cards.length - fresh.length;

    if (!fresh.length) {
      return toast(`Every card was already in "${d.name}"`);
    }
    d.cards.push(...fresh.map(withId));
    delete S.progress[scoreKey(d.id)];   // the old known/total no longer describes this deck
    touchDeck(d.id); save();
    draft = null;
    renderHome();
    toast(skipped
      ? `${fresh.length} added, ${skipped} already there`
      : `${fresh.length} card${fresh.length===1?"":"s"} added to ${d.name}`);
    setTimeout(() => openDeck(d.id), 260);
    return;
  }

  const name = ($("rdn").value.trim() || draft.deckName).slice(0,60);
  const cat = $("rsub").value;
  const id = uid("d");
  S.lastCat = cat;

  S.decks.push({ id, cat, name, note:"from your notes", cards: cards.map(withId), updated_at: nowISO() });
  save(); queueSync();
  draft = null;
  renderHome();
  toast(`${cards.length} card${cards.length===1?"":"s"} saved`);
  setTimeout(() => openDeck(id), 260);
}

/* entry points: click, and drag a photo onto the card */
$("btnScan").onclick = () => $("scanInput").click();
$("scanInput").onchange = e => {
  /* Copy the files out BEFORE clearing the input. input.files is live, so
     resetting value first empties the very list we are about to read — which
     silently dropped every scan. The reset itself is needed so picking the
     same file twice in a row still fires a change event. */
  const files = Array.from(e.target.files);
  e.target.value = "";
  if (files.length) runScan(files);
};

/** <optgroup> list of every existing deck, for the scan destination picker. */
function deckOptions(){
  const groups = S.categories.map(c => [c.name, S.decks.filter(d => d.cat === c.id)]);
  const orphans = S.decks.filter(d => !catById(d.cat));
  if (orphans.length) groups.push(["Uncategorised", orphans]);
  return groups.filter(([,ds]) => ds.length).map(([name, ds]) =>
    `<optgroup label="${esc(name)}">` +
    ds.map(d => `<option value="${esc(d.id)}">${esc(d.name)} (${d.cards.length})</option>`).join("") +
    `</optgroup>`).join("");
}

/** <option> list for every category the user has. */
function categoryOptions(selectedId){
  return S.categories.map(c =>

}

/**
 * Gemini reports "biology" or "math". Match that to one of the user's own
 * categories by id or name; otherwise fall back to whatever they filed a scan
 * under last, then the first category. Never invents a category.
 */
function guessCategory(guess){
  const byId = catById(guess);
  if (byId) return byId.id;
  const want = guess === "math" ? "maths" : String(guess || "").toLowerCase();
  const byName = S.categories.find(c => {
    const n = c.name.toLowerCase();
    return n === want || (want === "maths" && (n === "math" || n === "mathematics"));
  });
  if (byName) return byName.id;
  if (catById(S.lastCat)) return S.lastCat;
  return (S.categories[0] || {}).id;
}

/* ---------------- share codes ----------------
   Raw JSON for a 23-card deck is ~8 KB, which is unusable as something you
   paste into a chat, so the payload is deflated and base64url'd. Typical deck
   lands in the hundreds of characters. */
const CODE_PREFIX = "STUDYDECK1.";

const b64urlEncode = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64urlDecode = s => {
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(t + "=".repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));
};

async function deflate(str){
  const cs = new CompressionStream("deflate-raw");
  const buf = await new Response(new Blob([str]).stream().pipeThrough(cs)).arrayBuffer();
  return new Uint8Array(buf);
}
async function inflate(bytes){
  const ds = new DecompressionStream("deflate-raw");
  return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
}

async function makeCode(deckId){
  const d = S.decks.find(x => x.id === deckId);
  const cat = catById(d.cat);
  const payload = {
    n: d.name,
    c: cat ? { n: cat.name, k: cat.color } : null,
    k: d.cards.map(c => [c[0], c[1], c[2] || "concept", Array.isArray(c[3]) ? c[3] : null, c[5] || null]),
  };
  return CODE_PREFIX + b64urlEncode(await deflate(JSON.stringify(payload)));
}

/**
 * Everything here arrives from someone else, so nothing is trusted: types are
 * checked, lengths capped, counts capped, and every field coerced to a string
 * before it ever reaches the DOM (where esc() escapes it again).
 */
function sanitiseImport(raw){
  if (!raw || typeof raw !== "object") throw new Error("That code doesn't contain a deck.");
  const str = (v, max) => typeof v === "string" ? v.replace(/\s+/g," ").trim().slice(0, max) : "";
  const name = str(raw.n, 60) || "Shared deck";
  if (!Array.isArray(raw.k)) throw new Error("That code doesn't contain any cards.");
  if (raw.k.length > 500) throw new Error("That deck has more than 500 cards, which is too many to import.");

  const cards = raw.k.map(c => {
    if (!Array.isArray(c)) return null;
    const q = str(c[0], 400), a = str(c[1], 400);
    if (!q || !a) return null;
    const group = str(c[2], 24).toLowerCase() || "concept";
    const ds = Array.isArray(c[3])
      ? c[3].map(x => str(x, 400)).filter(Boolean).slice(0, 4)
      : [];
    const why = str(c[4], 400) || null;
    return withId([q, a, group, ds.length ? ds : null, null, why]);
  }).filter(Boolean);

  if (!cards.length) throw new Error("No usable cards were found in that code.");
  const cat = raw.c && typeof raw.c === "object"
    ? { name: str(raw.c.n, 30) || "Imported", color: PALETTE.includes(raw.c.k) ? raw.c.k : "c3" }
    : null;
  return { name, cards, cat };
}

async function decodeShare(text){
  const code = String(text || "").trim().replace(/\s+/g,"");
  if (!code) throw new Error("Paste a code first.");
  if (!code.startsWith(CODE_PREFIX)) throw new Error("That doesn't look like a Study Deck code — it should start with STUDYDECK1.");
  let json;
  try { json = await inflate(b64urlDecode(code.slice(CODE_PREFIX.length))); }
  catch { throw new Error("That code is damaged or incomplete. Ask for it again — chat apps sometimes cut long codes short."); }
  let parsed;
  try { parsed = JSON.parse(json); } catch { throw new Error("That code is damaged or incomplete."); }
  return sanitiseImport(parsed);
}

/* ------------------------------------------------------------------
   ACCOUNTS AND SYNC

   Accounts are additive. With no Supabase project configured, or with
   nobody signed in, the app behaves exactly as it always has: everything
   lives in localStorage and every feature except sync works. The sign-in
   prompt is an offer, never a wall.

   localStorage stays the source of truth for rendering, so the app is
   instant and works offline. The network is a background concern.
------------------------------------------------------------------ */

/* Fill these in from Supabase → Project Settings → API. Both are safe in the
   repo: the anon key identifies the project, it does not grant access. Row
   Level Security is what keeps one person's decks away from another's. */
const SUPABASE_URL = "https://anxbckjceydarymmjvmd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Q95L1zGV9YySaPWdOtuqLQ_dnGzGxXJ";

const SCAN_LIMIT_PER_DAY = 5;

/** Everything that talks to the backend, so the sync logic can be tested. */
const cloud = {
  client: null,
  user: null,
  status: "off",        // off | signedout | syncing | synced | offline | error
  lastSync: null,
  note: "",

  configured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); },

  async init(){
    if (!this.configured()) { this.status = "off"; return; }
    try {
      const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
      this.client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
      });
    } catch {
      this.status = "error"; this.note = "Could not load the accounts library.";
      return;
    }
    const { data } = await this.client.auth.getSession();
    this.user = data?.session?.user || null;
    this.status = this.user ? "syncing" : "signedout";
    /* Coming back from Google, the session is not ready when getSession() is
       first called — supabase-js is still reading it out of the URL. So the
       account bar has to be redrawn whenever the session actually arrives, not
       only when someone signs out, or it keeps saying "Sign in to sync" while
       the person is already signed in. */
    this.client.auth.onAuthStateChange((_e, session) => {
      const was = this.user?.id;
      this.user = session?.user || null;
      if (this.user && this.user.id !== was) {
        this.status = "syncing";
        syncNow({ firstLogin: true });
      } else if (!this.user) {
        this.status = "signedout";
      }
      renderAccountBar();
    });
  },

  async signUp(email, password){
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw new Error(authMessage(error));
    // With email confirmation on there is no session until they click the link.
    return { needsConfirmation: !data.session };
  },
  /** Hand off to Google. The page is replaced, and we come back with a session. */
  async signInWithGoogle(){
    const { error } = await this.client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) throw new Error(authMessage(error));
  },

  /** Which providers this project actually has switched on. */
  async providers(){
    try {
      const r = await fetch(SUPABASE_URL + "/auth/v1/settings", { headers: { apikey: SUPABASE_ANON_KEY } });
      if (!r.ok) return {};
      const s = await r.json();
      return s.external || {};
    } catch { return {}; }
  },

  async signIn(email, password){
    const { error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw new Error(authMessage(error));
  },
  async signOut(){
    await this.client.auth.signOut();
    this.user = null; this.status = "signedout";
  },
  async resetPassword(email){
    const { error } = await this.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    if (error) throw new Error(authMessage(error));
  },
  async accessToken(){
    const { data } = await this.client.auth.getSession();
    return data?.session?.access_token || null;
  },

  /* --- rows --- */
  async pull(){
    const [cats, decks, state] = await Promise.all([
      this.client.from("categories").select("*"),
      this.client.from("decks").select("*"),
      this.client.from("study_state").select("*").maybeSingle(),
    ]);
    for (const r of [cats, decks]) if (r.error) throw new Error(r.error.message);
    return { categories: cats.data || [], decks: decks.data || [], state: state.data || null };
  },
  async pushDecks(rows){
    if (!rows.length) return;
    const { error } = await this.client.from("decks").upsert(rows);
    if (error) throw new Error(error.message);
  },
  async pushCategories(rows){
    if (!rows.length) return;
    const { error } = await this.client.from("categories").upsert(rows);
    if (error) throw new Error(error.message);
  },
  async pushState(state){
    const { error } = await this.client.from("study_state")
      .upsert({ user_id: this.user.id, state, updated_at: new Date().toISOString() });
    if (error) throw new Error(error.message);
  },
};

/**
 * Read an OAuth failure out of the URL. Supabase puts it in the hash, and
 * sometimes the query too, so both are checked and the URL is then cleaned up
 * so a refresh does not show the error again.
 */
function takeOAuthError(){
  const fromQuery = new URLSearchParams(location.search);
  const fromHash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const code = fromQuery.get("error_code") || fromHash.get("error_code");
  const kind = fromQuery.get("error") || fromHash.get("error");
  if (!code && !kind) return null;

  let detail = fromQuery.get("error_description") || fromHash.get("error_description") || "";
  try { detail = decodeURIComponent(detail.replace(/\+/g, " ")); } catch {}

  history.replaceState(null, "", location.pathname);

  /* Google authenticated the person and handed back a code; Supabase then
     failed to trade that code for a token. That is a configuration problem
     between the two, not something the person signing in can fix by retrying. */
  if (/exchange external code/i.test(detail)) {
    return {
      title: "Google sign-in isn't set up correctly",
      body: "Google signed you in, but the site couldn't complete it. The Client Secret in Supabase most likely doesn't match the Client ID. Use email and password for now.",
      detail,
    };
  }
  if (/access_denied/i.test(kind || "") || /denied/i.test(detail)) {
    return { title: "Sign-in cancelled", body: "You didn't finish signing in with Google. Nothing has changed.", detail };
  }
  return {
    title: "Google sign-in didn't work",
    body: "Something went wrong on the way back from Google. Use email and password for now.",
    detail,
  };
}

/** Supabase error text is for developers. Say what to actually do. */
function authMessage(error){
  const m = String(error?.message || "").toLowerCase();
  if (m.includes("already registered") || m.includes("already been registered"))
    return "That email already has an account. Try signing in instead.";
  if (m.includes("invalid login"))
    return "No account matched that email and password. If you haven't created an account yet, use Create an account below.";
  if (m.includes("provider is not enabled") || m.includes("unsupported provider"))
    return "Google sign-in isn't switched on for this site yet. Use email and password for now.";
  if (m.includes("email not confirmed"))
    return "Check your email and click the confirmation link first.";
  if (m.includes("password") && m.includes("6"))
    return "Passwords need to be at least 6 characters.";
  /* Two different limits get conflated here. Supabase caps how many
     confirmation emails its built-in mail service will send per hour, which is
     nothing to do with how many times someone has tried to sign in. Telling
     them "too many attempts" when they have made one is both wrong and
     unfixable from their side. */
  if (m.includes("email rate limit") || m.includes("over_email_send_rate_limit") ||
      (m.includes("rate limit") && m.includes("email"))) {
    return "The site has hit its hourly limit for confirmation emails, which is a limit on this site, not on you. " +
           "Wait an hour, or sign in with Google instead.";
  }
  const wait = /after (\d+) seconds?/i.exec(m);
  if (wait) return `Please wait ${wait[1]} seconds before trying that again.`;
  if (m.includes("rate limit") || m.includes("too many requests"))
    return "That was too quick after the last attempt. Give it a minute and try again.";
  if (m.includes("invalid email") || m.includes("unable to validate"))
    return "That doesn't look like an email address.";
  if (m.includes("failed to fetch") || m.includes("network"))
    return "Couldn't reach the accounts service. Check your connection.";
  return error?.message || "Something went wrong signing in.";
}

/* ---------------- change stamps ----------------
   Sync needs to know which side is newer, so every mutation stamps the row it
   touched. Without this, sync could not tell an edit from an untouched copy. */
const nowISO = () => new Date().toISOString();

function touchDeck(id){
  const d = S.decks.find(x => x.id === id);
  if (d) d.updated_at = nowISO();
  queueSync();
}
function touchCategory(id){
  const c = S.categories.find(x => x.id === id);
  if (c) c.updated_at = nowISO();
  queueSync();
}
function touchState(){ S.stateUpdatedAt = nowISO(); queueSync(); }

/** Remember deletions so they can propagate; a hard delete would come back. */
function markDeleted(kind, id){
  S.tombstones = S.tombstones || {};
  S.tombstones[kind + ":" + id] = nowISO();
  queueSync();
}

let syncTimer = null;
function queueSync(){
  if (!cloud.user) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), 1200);
}

/* ---------------- the merge ----------------
   Last-write-wins per row on updated_at. Pure, so it can be tested without a
   network: give it both sides, get back what each side should end up with. */
/* Date.parse(0) is not 0 — it parses the string "0" as the year 2000, so a
   row with no stamp would look newer than genuinely recent server data and
   overwrite it. An unknown time must sort oldest. */
const stamp = v => {
  if (!v) return 0;
  const t = Date.parse(v);
  return Number.isFinite(t) ? t : 0;
};

function mergeRows(local, remote, { deletedLocally = {} } = {}){
  const byId = new Map();
  for (const r of remote) byId.set(r.id, { ...r, _from: "remote" });

  const toPush = [];
  for (const l of local) {
    const r = byId.get(l.id);
    if (!r) { byId.set(l.id, { ...l, _from: "local" }); toPush.push(l); continue; }
    const lt = stamp(l.updated_at);
    const rt = stamp(r.updated_at);
    if (lt > rt) { byId.set(l.id, { ...l, _from: "local" }); toPush.push(l); }
  }
  // a deletion is just another dated fact about a row
  for (const [key, when] of Object.entries(deletedLocally)) {
    const id = key.split(":").slice(1).join(":");
    const row = byId.get(id);
    if (!row) continue;
    if (stamp(when) >= stamp(row.updated_at)) {
      byId.set(id, { ...row, deleted_at: when, _from: "local" });
      toPush.push({ ...row, deleted_at: when });
    }
  }
  const merged = [...byId.values()].filter(r => !r.deleted_at);
  return { merged, toPush };
}

/** Pull, merge, push. Safe to call often; it is debounced by queueSync. */
async function syncNow({ firstLogin = false } = {}){
  if (!cloud.user || !cloud.client) return;
  if (syncNow._busy) { syncNow._again = true; return; }
  syncNow._busy = true;
  cloud.status = "syncing"; renderAccountBar();

  try {
    const remote = await cloud.pull();
    const uid = cloud.user.id;
    const tomb = S.tombstones || {};

    const localDecks = S.decks.map(d => ({
      id: d.id, user_id: uid, cat: d.cat || null, name: d.name,
      note: d.note || "", cards: d.cards,
      updated_at: d.updated_at || new Date(0).toISOString(),
    }));
    const localCats = S.categories.map(c => ({
      id: c.id, user_id: uid, name: c.name, color: c.color,
      updated_at: c.updated_at || new Date(0).toISOString(),
    }));

    const dm = mergeRows(localDecks, remote.decks, { deletedLocally: pick(tomb, "deck") });
    const cm = mergeRows(localCats, remote.categories, { deletedLocally: pick(tomb, "cat") });

    /* On the very first sign-in on a device, anything local that the account
       has never seen is uploaded rather than discarded. That is the whole
       point: your existing decks come with you. */
    await cloud.pushCategories(cm.toPush.map(strip));
    await cloud.pushDecks(dm.toPush.map(strip));

    S.decks = dm.merged.map(r => ({
      id: r.id, cat: r.cat, name: r.name, note: r.note || "",
      cards: (r.cards || []).map(withId), updated_at: r.updated_at,
    }));
    S.categories = cm.merged.map(r => ({
      id: r.id, name: r.name, color: r.color, updated_at: r.updated_at,
    }));
    if (!S.categories.length) S.categories = defaultCategories();

    /* Study state is one small blob and the newest wins outright, with two
       exceptions that only ever grow: a course card removed on any device
       stays removed, and a mock test taken on any device stays on record. */
    const localState = { progress:S.progress, starred:S.starred, best:S.best, streak:S.streak,
                         lastCat:S.lastCat, courseRemoved:S.courseRemoved, mocks:S.mocks };
    const rt = stamp(remote.state?.updated_at);
    const lt = stamp(S.stateUpdatedAt);
    if (rt > lt && remote.state?.state) {
      const mine = { courseRemoved: S.courseRemoved, mocks: S.mocks };
      Object.assign(S, remote.state.state);
      S.courseRemoved = unionRemoved(mine.courseRemoved, S.courseRemoved);
      S.mocks = unionMocks(mine.mocks, S.mocks);
      S.stateUpdatedAt = remote.state.updated_at;
    } else if (lt > rt || firstLogin) {
      await cloud.pushState(localState);
    }

    // the account's copies may predate the current course, or each other
    reconcileCourse();

    // tombstones that the server has now accepted have done their job
    S.tombstones = {};
    cloud.status = "synced";
    cloud.lastSync = Date.now();
    cloud.note = "";
    await save();
    renderIfHome();
  } catch (e) {
    cloud.status = navigator.onLine === false ? "offline" : "error";
    cloud.note = e?.message || "Sync failed.";
    console.warn("[sync]", e);
  } finally {
    syncNow._busy = false;
    renderAccountBar();
    if (syncNow._again) { syncNow._again = false; queueSync(); }
  }
}

const pick = (obj, prefix) => Object.fromEntries(
  Object.entries(obj).filter(([k]) => k.startsWith(prefix + ":")));

function unionRemoved(a = {}, b = {}){
  const out = {};
  for (const id of new Set([...Object.keys(a || {}), ...Object.keys(b || {})]))
    out[id] = [...new Set([...((a || {})[id] || []), ...((b || {})[id] || [])])];
  return out;
}
function unionMocks(a = [], b = []){
  const byAt = new Map([...(a || []), ...(b || [])].map(m => [m.at, m]));
  return [...byAt.values()].sort((x, y) => stamp(x.at) - stamp(y.at)).slice(-20);
}
const strip = r => { const { _from, ...rest } = r; return rest; };
const renderIfHome = () => { if (!$("home").classList.contains("hide")) renderHome(); };

/* ---------------- account bar ---------------- */
function renderAccountBar(){
  const el = $("account");
  if (!el) return;
  if (!cloud.configured()) { el.innerHTML = ""; return; }

  if (!cloud.user) {
    el.innerHTML = `<button class="linkbtn" id="btnSignIn">Sign in to sync</button>`;
    $("btnSignIn").onclick = () => authScreen();
    return;
  }
  const label = {
    syncing: "Syncing…",
    synced:  cloud.lastSync ? `Synced ${ago(cloud.lastSync)}` : "Synced",
    offline: "Offline — changes are saved here",
    error:   "Sync problem",
  }[cloud.status] || "";
  el.innerHTML = `<span class="who">${esc(cloud.user.email || "signed in")}</span>
    <span class="syncdot ${cloud.status}"></span><span class="syncmsg">${esc(label)}</span>
    <button class="linkbtn" id="btnAcct">Account</button>`;
  $("btnAcct").onclick = accountModal;
}

function ago(t){
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  return Math.round(s/3600) + "h ago";
}

function accountModal(){
  modal(`<h3>${esc(cloud.user.email)}</h3>
    <p class="sub">${cloud.status === "error"
      ? esc("Last sync failed: " + cloud.note)
      : "Your decks sync to this account on every device you sign in on."}</p>
    <div class="stack">
      <button class="linkbtn" id="acSync">Sync now</button>
      <button class="linkbtn danger" id="acOut">Sign out</button>
    </div>`, () => {});
  $("modalHost").querySelector("#mOk").textContent = "Done";
  $("acSync").onclick = () => { $("modalHost").innerHTML = ""; syncNow(); toast("Syncing…"); };
  $("acOut").onclick = () => {
    $("modalHost").innerHTML = "";
    confirmModal("Sign out?", "Your decks stay on this device. Signing back in brings the account's decks back.",
      "Sign out", async () => { await cloud.signOut(); renderHome(); toast("Signed out"); });
  };
}

/* ---------------- sign in / sign up ---------------- */
/** A dead end that is not the person's fault, explained without jargon. */
function showAuthProblem({ title, body, detail }){
  showScreen("review");
  $("reviewTitle").textContent = "Account";
  $("reviewBody").innerHTML = `
    <div class="rhead auth">
      <h3>${esc(title)}</h3>
      <p class="sub">${esc(body)}</p>
      <div class="row">
        <button class="act" id="apHome">Back to decks</button>
        <button class="act primary" id="apEmail">Use email instead</button>
      </div>
      <div class="stack"><button class="linkbtn" id="apWhy">What went wrong</button></div>
      <pre class="diag hide" id="apDetail">${esc(detail || "No detail was returned.")}</pre>
    </div>`;
  $("apHome").onclick = () => renderHome();
  $("apEmail").onclick = () => authScreen("in");
  $("apWhy").onclick = () => {
    const open = !$("apDetail").classList.toggle("hide");
    $("apWhy").textContent = open ? "Hide details" : "What went wrong";
  };
}

function authScreen(mode = "in"){
  showScreen("review");
  $("reviewTitle").textContent = "Account";
  const titles = { in:"Sign in", up:"Create an account", reset:"Reset your password" };
  const blurbs = {
    in: "Your decks follow you between your phone and your computer.",
    up: "One account, and your decks are on every device you sign in on.",
    reset: "We'll email you a link to set a new password.",
  };
  $("reviewBody").innerHTML = `
    <div class="rhead auth">
      <h3>${titles[mode]}</h3>
      <p class="sub">${blurbs[mode]}</p>

      ${mode === "reset" ? "" : `
        <button class="act google hide" id="auGoogle">
          <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
            <path fill="#4285F4" d="M17.6 9.2c0-.6-.05-1.2-.15-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5Z"/>
            <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3Z"/>
            <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6Z"/>
          </svg>
          Continue with Google
        </button>
        <div class="or hide" id="auOr"><span>or</span></div>`}

      <label for="auEmail">Email</label>
      <input id="auEmail" type="email" autocomplete="email" inputmode="email"
             autocapitalize="none" spellcheck="false" placeholder="you@gmail.com">
      ${mode === "reset" ? "" : `
        <label for="auPass">Password</label>
        <input id="auPass" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}"
               placeholder="${mode==="up"?"At least 6 characters":""}">`}
      <p class="sub danger" id="auErr"></p>
      <div class="row">
        <button class="act" id="auBack">Back</button>
        <button class="act primary" id="auGo">${mode==="up"?"Create account":mode==="reset"?"Send link":"Sign in"}</button>
      </div>
      <div class="stack">
        ${mode!=="up"    ? `<button class="linkbtn" id="auToUp">Create an account</button>` : ""}
        ${mode!=="in"    ? `<button class="linkbtn" id="auToIn">I already have an account</button>` : ""}
        ${mode==="in"    ? `<button class="linkbtn" id="auToReset">I forgot my password</button>` : ""}
      </div>
    </div>`;

  /* Only offer Google if the project actually has it switched on — a button
     that fails on click is worse than no button. */
  cloud.providers().then(p => {
    if (!p.google || !$("auGoogle")) return;
    $("auGoogle").classList.remove("hide");
    $("auOr").classList.remove("hide");
    $("auGoogle").onclick = async () => {
      $("auErr").textContent = "";
      try { await cloud.signInWithGoogle(); }
      catch (e) { $("auErr").textContent = e.message; }
    };
  });

  $("auBack").onclick = () => renderHome();
  $("auToUp")   && ($("auToUp").onclick   = () => authScreen("up"));
  $("auToIn")   && ($("auToIn").onclick   = () => authScreen("in"));
  $("auToReset")&& ($("auToReset").onclick= () => authScreen("reset"));

  const submit = async () => {
    const email = $("auEmail").value.trim();
    const pass = mode === "reset" ? "" : $("auPass").value;
    const err = $("auErr");
    err.textContent = "";
    if (!email) return err.textContent = "Enter your email address.";
    if (mode !== "reset" && pass.length < 6) return err.textContent = "Passwords need to be at least 6 characters.";

    const btn = $("auGo"); btn.disabled = true; const was = btn.textContent; btn.textContent = "Working…";
    try {
      if (mode === "up") {
        const { needsConfirmation } = await cloud.signUp(email, pass);
        if (needsConfirmation) {
          $("reviewBody").innerHTML = `<div class="rhead">
            <h3>Check your email</h3>
            <p class="sub">We sent a confirmation link to ${esc(email)}. Click it, then sign in.</p>
            <div class="row"><button class="act primary" id="auDone">Back to decks</button></div></div>`;
          $("auDone").onclick = () => renderHome();
          return;
        }
      } else if (mode === "reset") {
        await cloud.resetPassword(email);
        $("reviewBody").innerHTML = `<div class="rhead">
          <h3>Check your email</h3>
          <p class="sub">If ${esc(email)} has an account, a reset link is on its way.</p>
          <div class="row"><button class="act primary" id="auDone">Back to decks</button></div></div>`;
        $("auDone").onclick = () => renderHome();
        return;
      } else {
        await cloud.signIn(email, pass);
      }
      renderHome();
      toast("Signed in");
      syncNow({ firstLogin: true });
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false; btn.textContent = was;
    }
  };
  $("auGo").onclick = submit;
  ["auEmail","auPass"].forEach(id => $(id) && ($(id).onkeydown = e => { if (e.key === "Enter") submit(); }));
  $("auEmail").focus();
}

addEventListener("online",  () => { if (cloud.user) syncNow(); });
addEventListener("offline", () => { cloud.status = "offline"; renderAccountBar(); });
addEventListener("focus",   () => { if (cloud.user && cloud.status !== "syncing") queueSync(); });

(async () => {
  const oauthError = takeOAuthError();
  await load();
  renderHome();
  await cloud.init();
  renderAccountBar();
  if (oauthError) showAuthProblem(oauthError);
  else if (cloud.user) syncNow({ firstLogin: true });
})();

/* ------------------------------------------------------------------
   A small shoal drifting behind the page. Clicking anywhere sends the
   nearby fish darting off, then they settle back to a cruise.

   Deliberately cheap: one canvas, no library, ~16 fish, paused when the
   tab is hidden and skipped entirely for reduced-motion or tiny screens.
   The canvas never takes pointer events — clicks are read from the
   document so nothing in the UI is blocked.
------------------------------------------------------------------ */
(function shoal(){
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  const cv = document.getElementById("sea");
  if (!cv || !cv.getContext) return;
  const cx = cv.getContext("2d", { alpha: true });

  let W = 0, H = 0, dpr = 1, fish = [], raf = null, last = 0;

  const rand = (a,b) => a + Math.random() * (b - a);
  const COUNT = () => Math.max(6, Math.min(18, Math.round(innerWidth * innerHeight / 78000)));

  function palette(){
    const cs = getComputedStyle(document.documentElement);
    return ["c2","c3","c4","c5"].map(k => cs.getPropertyValue("--" + k).trim() || "#6FD0D5");
  }

  function spawn(n){
    const cols = palette();
    fish = Array.from({length:n}, () => {
      const dir = Math.random() < 0.5 ? -1 : 1;
      return {
        x: rand(0, W), y: rand(0, H),
        vx: dir * rand(14, 34), vy: rand(-6, 6),
        len: rand(11, 22),
        col: cols[(Math.random() * cols.length) | 0],
        alpha: rand(0.16, 0.4),
        phase: rand(0, Math.PI * 2),
        wob: rand(1.6, 3.2),
      };
    });
  }

  function resize(){
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (fish.length !== COUNT()) spawn(COUNT());
  }

  /* A fish: teardrop body plus a tail that beats as it swims. */
  function draw(f, t){
    const ang = Math.atan2(f.vy, f.vx);
    const beat = Math.sin(t * f.wob + f.phase);
    cx.save();
    cx.translate(f.x, f.y);
    cx.rotate(ang);
    cx.globalAlpha = f.alpha;
    cx.fillStyle = f.col;

    const L = f.len, Bd = L * 0.42;
    cx.beginPath();
    cx.moveTo(L * 0.5, 0);
    cx.quadraticCurveTo(0, -Bd, -L * 0.42, 0);
    cx.quadraticCurveTo(0, Bd, L * 0.5, 0);
    cx.fill();

    cx.beginPath();                       // tail
    cx.moveTo(-L * 0.38, 0);
    cx.lineTo(-L * 0.72, -Bd * (0.55 + beat * 0.35));
    cx.lineTo(-L * 0.72,  Bd * (0.55 - beat * 0.35));
    cx.closePath();
    cx.fill();
    cx.restore();
  }

  function step(now){
    const t = now / 1000;
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    cx.clearRect(0, 0, W, H);

    for (const f of fish){
      // gentle wander, then ease back toward a cruising speed
      f.vy += Math.sin(t * 0.6 + f.phase) * 6 * dt;
      const sp = Math.hypot(f.vx, f.vy);
      const cruise = 26;
      if (sp > cruise){
        const k = 1 - Math.min(1, (sp - cruise) * 0.9 * dt / sp);
        f.vx *= k; f.vy *= k;
      } else if (sp < cruise * 0.6){
        f.vx *= 1 + 0.6 * dt;
      }
      f.vy *= 0.995;

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      const m = f.len * 2;                // wrap around the edges
      if (f.x < -m) f.x = W + m; else if (f.x > W + m) f.x = -m;
      if (f.y < -m) f.y = H + m; else if (f.y > H + m) f.y = -m;

      draw(f, t);
    }
    raf = requestAnimationFrame(step);
  }

  /** Anything nearby bolts away from the point, hardest at the centre. */
  function scatter(px, py){
    for (const f of fish){
      const dx = f.x - px, dy = f.y - py;
      const d = Math.hypot(dx, dy);
      if (d > 240) continue;
      const push = (1 - d / 240) ** 2 * 460;
      const nx = d < 1 ? Math.random() - 0.5 : dx / d;
      const ny = d < 1 ? Math.random() - 0.5 : dy / d;
      f.vx += nx * push;
      f.vy += ny * push * 0.7;
    }
  }

  const start = () => { if (!raf){ last = performance.now(); raf = requestAnimationFrame(step); } };
  const stop  = () => { if (raf){ cancelAnimationFrame(raf); raf = null; } };

  addEventListener("resize", resize, { passive: true });
  document.addEventListener("click", e => scatter(e.clientX, e.clientY), { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  // the theme toggle changes the palette the fish are drawn from
  new MutationObserver(() => { const c = palette(); fish.forEach(f => f.col = c[(Math.random()*c.length)|0]); })
    .observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });

  resize();
  start();
})();
</script>
