        null, "It deals only with what passed through the tract without being absorbed, which is why your note stresses only. Waste made by cells leaves another way."],
      ["How is egestion different from excretion?", "Egestion removes undigested material from the digestive tract; excretion removes metabolic wastes produced by cells.", "compare",
        ["Egestion removes metabolic wastes produced by cells; excretion removes undigested material from the digestive tract.", "They are two names for the same process: removing whatever the body cannot use, mostly in sweat and urine.", "Egestion happens in the stomach and small intestine; excretion happens in the large intestine and rectum.", "Egestion removes water and salts from the colon; excretion removes the solid waste left behind."],
        null, "Undigested food never actually entered your cells, so getting rid of it is egestion. Excretion is waste your cells made, mostly lost in sweat and urine."],
      ["Which process removes the metabolic wastes produced by cells, mostly in sweat and urine?", "Excretion.", "term",
        ["Egestion.", "Absorption.", "Ingestion.", "Peristalsis."],
        null, "It is easy to mix up with egestion. Ask whether the waste was made by the body's cells: if it was, removing it is excretion."],

      /* ---------- the tract and the accessory organs ---------- */
      ["What is the digestive tract?", "All of the digestive organs that food passes through.", "term",
        ["Every organ that produces a digestive enzyme.", "The organs that support digestion without touching food.", "Only the stomach and the small intestine.", "The blood vessels that carry nutrients away."],
        null, "It is one continuous tube from mouth to anus. Organs that only send secretions into it, like the liver, are not part of it."],
      ["List the organs of the digestive tract in order.", "Mouth, pharynx, esophagus, stomach, small intestine, large intestine, rectum and anus.", "list",
        ["Mouth, esophagus, pharynx, stomach, large intestine, small intestine, rectum and anus.", "Mouth, pharynx, esophagus, stomach, liver, pancreas, small intestine and anus.", "Mouth, pharynx, trachea, stomach, small intestine, large intestine, rectum and anus.", "Mouth, esophagus, stomach, pancreas, small intestine, rectum, large intestine and anus."],
        null, "Every organ here is part of the same tube food travels down. The liver and pancreas never appear because food never passes through them."],
      ["What are the accessory organs of the digestive system?", "Organs that support digestion but are not part of the digestive tract, because food does not pass through them.", "term",
        ["The organs food passes through after the stomach, where most nutrients are absorbed.", "Organs that digest food inside themselves but are not needed to survive.", "The rings of muscle along the tract that push food forward and stop it flowing back.", "Organs that absorb nutrients into the lymph, because food passes slowly through them."],
        null, "They help by adding secretions such as saliva, bile and enzymes. The food itself stays in the tract the whole time."],
      ["Name the four accessory organs of the digestive system.", "The salivary glands, liver, gallbladder and pancreas.", "list",
        ["The stomach, liver, gallbladder and pancreas.", "The salivary glands, esophagus, liver and pancreas.", "The liver, gallbladder, pancreas and large intestine.", "The salivary glands, pharynx, gallbladder and spleen."],
        null, "All four make or store a secretion that is sent into the tract: saliva, bile or pancreatic juice. None of them carries food."],
      ["How can you tell an organ of the digestive tract from an accessory organ?", "Ask whether food passes through it: tract organs carry the food, while accessory organs only send in secretions.", "compare",
        ["Tract organs make enzymes, and accessory organs never do.", "Accessory organs are found only in the mouth.", "Tract organs are made of skeletal muscle, and accessory organs of smooth muscle.", "Accessory organs absorb nutrients, and tract organs do not."],
        null, "This answers the handout's Think About It. The pancreas makes plenty of enzymes, so making enzymes cannot be the test."],

      /* ---------- sphincters ---------- */
      ["What are sphincters?", "Rings of muscle along the digestive tract that control the movement of food from one region to another.", "term",
        ["Folds in the stomach lining that let it expand as it fills with a meal.", "Finger-like projections in the small intestine that absorb nutrients into the blood.", "Flaps of cartilage that cover the trachea so food goes down the esophagus.", "Glands along the digestive tract that release enzymes into the food as it passes."],
        null, "Your note calls them kind of like valves: they open to let food through and close to stop it going back."],
      ["How does a sphincter open and close?", "It contracts to close and relaxes to open.", "process",
        ["It contracts to open and relaxes to close.", "It stays open unless food is present.", "It is pushed open and shut by the food itself.", "It opens and closes on hinges of cartilage."],
        null, "A ring of muscle squeezes the opening shut when it contracts, so relaxing is what lets material through. It is easy to learn this the wrong way round."],
      ["Why are sphincters described as being like valves?", "They let material pass forward and help stop it flowing backward.", "concept",
        ["They speed digestion up by squeezing food into smaller pieces.", "They filter large pieces of food out before it moves on.", "They release a burst of enzymes every time they open.", "They let air and food share a single passage safely."],
        null, "Keeping the flow one-way lets each region hold its contents long enough to do its job, and keeps stomach acid out of the esophagus."],
      ["Which sphincter controls the passage of the bolus from the pharynx into the esophagus?", "The upper esophageal sphincter (UES).", "structure",
        ["The lower esophageal sphincter (LES).", "The pyloric sphincter.", "The ileocecal sphincter.", "The internal anal sphincter."],
        null, "Upper because it sits at the top of the esophagus. It is the doorway food passes through right after swallowing."],
      ["Which sphincter controls the passage of the bolus from the esophagus into the stomach?", "The lower esophageal sphincter (LES).", "structure",
        ["The upper esophageal sphincter (UES).", "The pyloric sphincter.", "The ileocecal sphincter.", "The external anal sphincter."],
        null, "Lower because it is at the bottom of the esophagus, where the esophagus meets the stomach."],
      ["Besides letting food into the stomach, what does the lower esophageal sphincter do?", "It helps stop stomach contents flowing back into the esophagus.", "concept",
        ["It releases acid into the stomach.", "It churns food into chyme.", "It stops air from entering the stomach.", "It controls when chyme enters the small intestine."],
        null, "Stomach contents are acidic, and the esophagus lacks the stomach's protective mucus, so backflow irritates it. That burning feeling is heartburn."],
      ["Which sphincter controls the passage of chyme from the stomach into the small intestine?", "The pyloric sphincter.", "structure",
        ["The lower esophageal sphincter.", "The ileocecal sphincter.", "The upper esophageal sphincter.", "The external anal sphincter."],
        null, "It sits at the pylorus, the lower end of the stomach, and lets chyme out a little at a time so the small intestine is not overwhelmed."],
      ["Which sphincter controls the passage of material from the small intestine into the large intestine?", "The ileocecal sphincter (valve).", "structure",
        ["The pyloric sphincter.", "The internal anal sphincter.", "The lower esophageal sphincter.", "The upper esophageal sphincter."],
        null, "The name tells you where it is: between the ileum, the last part of the small intestine, and the cecum, the first part of the large intestine."],
      ["What does the internal anal sphincter do?", "It relaxes involuntarily when the rectum fills with feces.", "process",
        ["It lets a person choose when defecation happens.", "It moves material from the small intestine into the colon.", "It absorbs water from the feces.", "It contracts to push feces out of the rectum."],
        null, "Involuntary means you do not control it. It is the first of two gates, and the second, external one is the gate you can hold shut."],
      ["What does the external anal sphincter do?", "It is under voluntary control, letting a person choose when defecation happens.", "process",
        ["It relaxes automatically, without any choice, whenever the rectum fills.", "It controls the passage of chyme from the stomach into the duodenum.", "It stops stomach acid flowing backward into the esophagus.", "It moves feces along the colon by waves of peristalsis."],
        null, "It is the only digestive sphincter you consciously control, because it is built from a different kind of muscle from the others."],
      ["Why can the external anal sphincter be consciously controlled?", "It is made of skeletal muscle.", "concept",
        ["It is made of smooth muscle.", "It is controlled by the endocrine system.", "It contains rings of cartilage.", "It is lined with extra mucus."],
        null, "Skeletal muscle is the voluntary kind that moves your arms and legs. The other digestive sphincters are smooth muscle and work on their own."],
      ["Are most digestive sphincters controlled voluntarily or involuntarily?", "Involuntarily.", "concept",
        ["Voluntarily.", "Voluntarily, except the pyloric sphincter.", "Only by the food pressing on them.", "Half are voluntary and half are involuntary."],
        null, "You do not decide when food leaves your stomach. Only the external anal sphincter is under conscious control."],
      ["List the sphincters of the digestive tract in the order food meets them.", "Upper esophageal, lower esophageal, pyloric, ileocecal, internal anal, external anal.", "list",
        ["Lower esophageal, upper esophageal, pyloric, ileocecal, external anal, internal anal.", "Upper esophageal, pyloric, lower esophageal, ileocecal, internal anal, external anal.", "Pyloric, upper esophageal, lower esophageal, internal anal, ileocecal, external anal.", "Upper esophageal, lower esophageal, ileocecal, pyloric, internal anal, external anal."],
        null, "Follow the tube: the top and bottom of the esophagus, out of the stomach, out of the small intestine, then the two gates at the very end."],

      /* ---------- the mouth ---------- */
      ["What does the mouth, or oral cavity, form?", "The beginning of the digestive tract.", "structure",
        ["The beginning of the respiratory tract only.", "An accessory organ of digestion.", "The end of the digestive tract.", "The shared passage for food and air."],
        null, "It is where ingestion happens and where both physical and chemical digestion begin. The shared passage for food and air comes next, at the pharynx."],
      ["What do the teeth do in digestion?", "They mechanically break food into smaller pieces.", "process",
        ["They chemically break starch into disaccharides.", "They form food into a bolus for swallowing.", "They release enzymes that digest proteins.", "They push food into the esophagus."],
        null, "Teeth change the size of the pieces, not the molecules, so this is physical digestion. Smaller pieces give enzymes more surface to work on."],
      ["What do the salivary glands release?", "Saliva, which contains mucus and enzymes such as salivary amylase.", "term",
        ["Bile, which contains bile salts and bile pigments.", "Gastric juice, which contains hydrochloric acid.", "Bicarbonate, which neutralizes acid.", "Pepsinogen, which digests protein."],
        null, "The enzymes start chemical digestion, and the mucus helps food slide down when you swallow. Your note marks the amylase as chemical digestion."],
      ["What does the tongue do in digestion?", "It moves food around the mouth, forms it into a bolus and helps with swallowing.", "process",
        ["It releases salivary amylase, which begins the chemical digestion of starch.", "It grinds food into smaller pieces against the teeth before it is swallowed.", "It covers the opening of the trachea so that food goes down the esophagus.", "It absorbs simple sugars from food straight into the bloodstream."],
        null, "It handles the food rather than digesting it, shaping chewed food into something that can be swallowed safely."],
      ["What is a bolus?", "The small ball of chewed food formed by the tongue for swallowing.", "term",
        ["The semi-liquid mixture of food and gastric juice.", "A wave of muscle contraction in the esophagus.", "The undigested material stored in the rectum.", "A fold in the stomach wall."],
        null, "Food is called a bolus from the mouth down the esophagus. Once the stomach churns it with gastric juice it becomes chyme."],
      ["Name the three salivary glands shown on the diagram.", "The parotid, submandibular and sublingual glands.", "list",
        ["The parotid, thyroid and sublingual glands.", "The pancreatic, parotid and gastric glands.", "The submandibular, adrenal and parotid glands.", "The sublingual, pituitary and submandibular glands."],
        null, "Submandibular means under the jaw and sublingual means under the tongue. Parotid means beside the ear, which is where that gland sits."],
      ["Which kinds of digestion begin in the mouth?", "Both: physical digestion by chewing, and chemical digestion of starch by salivary amylase.", "concept",
        ["Only physical digestion, by chewing; chemical digestion waits for the stomach.", "Both: physical digestion by chewing, and chemical digestion of proteins by pepsin.", "Only chemical digestion, of fats by lipase; the teeth do no digesting at all.", "Neither, because both kinds of digestion begin once food reaches the stomach."],
        null, "The mouth starts both kinds, but chemically it only works on starch. Protein waits for the stomach and fat for the small intestine."],
      ["Besides starting starch digestion, what does saliva do to food?", "It moistens and lubricates the food.", "process",
        ["It neutralizes the acid in food.", "It kills all the bacteria in food.", "It breaks proteins into amino acids.", "It absorbs water from the food."],
        null, "Wet, slippery food forms a bolus easily and slides down the esophagus without scraping it."],
      ["Why does chewing make chemical digestion faster?", "It breaks food into smaller pieces, increasing the surface area for enzymes to act on.", "concept",
        ["It warms the food up to the optimal temperature of the enzymes in saliva.", "It pushes enzymes from the teeth directly into each piece of food.", "It changes the pH of the food to neutral so that pepsin can work on it.", "It breaks the chemical bonds in starch so that enzymes have less to do."],
        null, "Enzymes can only reach the outside of a piece of food. Cutting it up exposes far more surface at once, and makes it easier to swallow too."],
      ["Which enzyme begins the chemical digestion of starch?", "Salivary amylase.", "term",
        ["Pepsin.", "Pancreatic lipase.", "Trypsin.", "Peptidase."],
        null, "It is released in saliva, which is why starch is the only nutrient whose chemical digestion starts in the mouth."],
      ["What does salivary amylase break starch down into?", "Disaccharides.", "process",
        ["Amino acids.", "Glycerol and fatty acids.", "Polypeptides.", "Glycogen."],
        null, "Starch is a polysaccharide, a long chain of glucose. Amylase cuts it into two-sugar pieces, mainly maltose, which other enzymes split later."],
      ["What is the optimal pH of salivary amylase?", "About 7, the neutral pH of the mouth.", "number",
        ["About 2, the pH of the stomach.", "About 8, the pH of the small intestine.", "About 4, slightly acidic.", "About 11, strongly basic."],
        null, "Each enzyme suits the place it works. Your note adds the consequence: it will not work at pH 2 to 3, so it stops once it reaches the stomach."],
      ["Is all the starch in a meal digested in the mouth?", "No. Only some is; the rest is digested in the small intestine.", "concept",
        ["Yes. Salivary amylase digests all of it before swallowing.", "No. The rest is digested by pepsin in the stomach.", "No. The rest is digested by bacteria in the colon.", "Yes, as long as the food is chewed thoroughly."],
        null, "Food does not stay in the mouth long enough for amylase to finish. Pancreatic amylase completes the job in the small intestine."],
      ["Why does the digestion of starch stop once food enters the stomach?", "Salivary amylase works best near pH 7, and the stomach's acid, at pH 1 to 3, denatures it.", "concept",
        ["The stomach has already absorbed all the starch through its wall.", "Pepsin takes over and breaks the starch down instead of amylase.", "Starch is too large to pass through the lower esophageal sphincter.", "The stomach is too cold for salivary amylase, so it slows to a stop."],
        null, "This links straight back to Topic 2: outside its pH range an enzyme loses the shape of its active site, so starch no longer fits."],

      /* ---------- the pharynx and esophagus ---------- */
      ["What is the pharynx?", "The throat: the passageway food moves through from the mouth to the esophagus.", "term",
        ["The tube that carries food from the throat to the stomach.", "The voice box at the top of the trachea.", "The first section of the small intestine.", "The flap that covers the trachea."],
        null, "It is short but busy, because air and food both cross it. The esophagus is the next tube down."],
      ["Why is the pharynx called a common passageway?", "Both the digestive and the respiratory systems use it.", "concept",
        ["It is shared by the stomach and the small intestine.", "Every nutrient is absorbed there.", "It joins the liver to the gallbladder.", "It is the most common site of infection."],
        null, "Air heading for the trachea and food heading for the esophagus both pass through it, which is why swallowing needs a safety mechanism."],
      ["During swallowing, what stops food from entering the trachea?", "The epiglottis, a flap of cartilage that covers the opening of the trachea.", "structure",
        ["The uvula, which blocks the nasal cavity.", "The upper esophageal sphincter, which closes the trachea.", "The tongue, which presses against the larynx.", "The pyloric sphincter, which closes behind the food."],
        null, "Because the pharynx is shared, food could go down the wrong tube. Covering the trachea for the moment of swallowing sends it to the esophagus instead."],
      ["What does the esophagus do?", "It carries food from the pharynx to the stomach.", "structure",
        ["It carries air from the larynx to the bronchi.", "It carries chyme from the stomach to the small intestine.", "It carries bile from the liver to the duodenum.", "It stores food until the stomach is empty."],
        null, "It is a muscular tube that moves food by squeezing rather than relying on gravity, which is why you can swallow lying down."],
      ["How does a bolus move through the esophagus?", "By peristalsis.", "process",
        ["By segmentation.", "By gravity alone.", "By the beating of cilia.", "By diffusion."],
        null, "Gravity helps but is not needed. Waves of muscle contraction push the bolus along, even upside down."],
      ["What is peristalsis?", "A series of contractions and relaxations of smooth muscle that moves contents along the digestive tract.", "term",
        ["The churning of food with gastric juice in the stomach, which turns a bolus into chyme.", "The chemical breakdown of food by enzymes as it moves along the digestive tract.", "Circular muscles dividing the small intestine into segments to mix the chyme in place.", "The voluntary control of the external anal sphincter, which decides when defecation happens."],
        null, "Muscle behind the food contracts while muscle ahead relaxes, so the contents are squeezed forward in a wave, like toothpaste along a tube."],
      ["What type of muscle carries out peristalsis?", "Smooth muscle.", "term",
        ["Skeletal muscle.", "Cardiac muscle.", "Elastic cartilage.", "Connective tissue."],
        null, "Smooth muscle is involuntary, which is why you never have to think about moving food along once you have swallowed."],
      ["List the structures food passes through before it reaches the small intestine.", "Mouth, pharynx, upper esophageal sphincter, esophagus, lower esophageal sphincter, stomach, pyloric sphincter.", "list",
        ["Mouth, pharynx, esophagus, stomach, liver, pancreas.", "Mouth, larynx, trachea, esophagus, stomach, pyloric sphincter.", "Mouth, pharynx, lower esophageal sphincter, esophagus, upper esophageal sphincter, stomach.", "Mouth, esophagus, pharynx, stomach, ileocecal sphincter."],
        null, "This is the handout's Think About It. Include the sphincters and leave out the accessory organs, since food never enters them."],

      /* ---------- the stomach ---------- */
      ["Describe the stomach's shape and structure.", "A muscular, J-shaped organ with many folds on its inner wall.", "structure",
        ["A thin, straight tube lined with villi.", "A long, coiled tube with three sections.", "A small sac that stores bile.", "A flap of cartilage at the top of the trachea."],
        null, "The muscle is for churning, and the folds are what let it stretch to hold a whole meal."],
      ["What are rugae?", "The folds on the inner wall of the stomach that let it expand.", "term",
        ["Finger-like projections in the small intestine.", "Rings of muscle that control the movement of food.", "Pouches in the wall of the large intestine.", "Tiny air sacs at the ends of the bronchioles."],
        null, "When the stomach is empty its lining is bunched into folds. As it fills they flatten out, so it can hold much more without tearing."],
      ["What two jobs does the stomach do with food?", "It stores food for a while and carries out both mechanical and chemical digestion.", "concept",
        ["It absorbs most of the nutrients from food and produces bile.", "It digests all of the starch and absorbs most of the water.", "It only stores food, and leaves all of the digesting to the intestine.", "It produces bicarbonate and digests fats with lipase."],
        null, "Storing lets you eat a meal in minutes but digest it over hours. Churning is the mechanical part; acid and pepsin are the chemical part."],
      ["What is chyme?", "The semi-liquid mixture of food and gastric secretions made in the stomach.", "term",
        ["The small ball of chewed food formed by the tongue for swallowing.", "The green fluid released by the gallbladder to emulsify fats.", "The undigested waste stored in the rectum until it is eliminated.", "The enzyme that the stomach releases to digest proteins."],
        null, "A bolus goes into the stomach and chyme comes out. The change is the churning and mixing with gastric juice."],
      ["How is chyme produced?", "Muscular contractions of the stomach churn and mix food with gastric secretions.", "process",
        ["Bile emulsifies the food in the small intestine into tiny droplets.", "The teeth grind the food into a paste before it is swallowed.", "Bacteria in the colon break the remaining food down.", "Salivary amylase dissolves the bolus completely in the mouth."],
        null, "The stomach wall is thick with muscle so it can churn, which mixes everything together and breaks food apart at the same time."],
      ["What moves chyme out of the stomach and into the small intestine?", "Peristalsis, through the pyloric sphincter.", "process",
        ["Segmentation, through the ileocecal sphincter.", "Gravity, through the lower esophageal sphincter.", "Cilia, through the pancreatic duct.", "Bile, through the common bile duct."],
        null, "The same wave-like contractions that move food down the esophagus push chyme on, and the pyloric sphincter controls how much leaves at once."],
      ["When do the cells lining the stomach secrete gastric juice?", "When food is present.", "concept",
        ["Only while you are asleep.", "Constantly, even when the stomach is empty.", "Only after chyme has left the stomach.", "Only when bile reaches the stomach."],
        null, "Acid and enzymes are only useful when there is food to work on, so the stomach releases them as food arrives."],
      ["What is gastric juice made of?", "Hydrochloric acid, water, alkaline mucus, salts and enzymes.", "list",
        ["Bile salts, bile pigments, water and cholesterol.", "Bicarbonate, water, lipase and pancreatic amylase.", "Hydrochloric acid, bile, trypsin and bicarbonate.", "Saliva, water, mucus and salivary amylase."],
        null, "Each part has a job: the acid sets the pH and kills bacteria, the enzymes digest, and the alkaline mucus protects the stomach from itself."],
      ["What pH does hydrochloric acid keep the stomach at?", "Between 1 and 3.", "number",
        ["Between 6 and 8.", "About 7, neutral.", "About 8, slightly basic.", "Between 10 and 12."],
        null, "That is strongly acidic: right for pepsin, which works best at about 2, and far too acidic for salivary amylase."],
      ["Name two things the stomach's hydrochloric acid does.", "It kills most bacteria swallowed with food and activates the stomach's enzymes.", "list",
        ["It emulsifies the fats in food and neutralizes the chyme.", "It digests starch into disaccharides and absorbs water.", "It produces the protective mucus and moves food along.", "It breaks proteins into amino acids and then absorbs them."],
        null, "Your note explains the second part: the acid sets the right pH, which is what switches pepsinogen into working pepsin."],
      ["What protects the stomach's own cells from hydrochloric acid and enzymes?", "The alkaline mucus in gastric juice.", "concept",
        ["Bicarbonate from the pancreas.", "A layer of bile salts.", "The rugae, which keep acid away from the wall.", "Pepsinogen, which neutralizes the acid."],
        null, "Without it the stomach would start digesting its own lining. Being alkaline, the mucus also neutralizes acid right at the surface."],
      ["How does physical digestion continue in the stomach?", "Peristaltic action churns food, breaking it into smaller pieces and mixing it with gastric juice.", "process",
        ["Teeth-like ridges on the stomach wall grind the food into a fine paste.", "Bile salts split the fat in the food into many small droplets.", "Segmentation pinches the stomach into small sections that mix the food.", "Pepsin breaks the bonds in the food, which is a form of physical digestion."],
        null, "This is mechanical: no bonds are broken, the pieces just get smaller and better mixed, which speeds up the chemical digestion happening alongside."],

      /* ---------- protein digestion begins ---------- */
      ["Where does the chemical digestion of proteins begin?", "In the stomach.", "concept",
        ["In the mouth.", "In the small intestine.", "In the large intestine.", "In the liver."],
        null, "Saliva has no protease, so proteins pass through the mouth chemically untouched. Pepsin in the stomach is the first enzyme to work on them."],
      ["What is pepsinogen?", "The inactive form of the enzyme pepsin, secreted by cells of the stomach lining.", "term",
        ["The active enzyme that digests starch in the stomach at a pH of about 2.", "A hormone from the stomach that triggers the release of bile.", "The alkaline mucus that protects the stomach lining from acid.", "A protein from food that is absorbed through the stomach wall."],
        null, "The -ogen ending marks an inactive form. It only becomes pepsin once it meets the acid inside the stomach."],
      ["Why is pepsin secreted as inactive pepsinogen?", "So it does not digest the proteins in the stomach cells that make it.", "concept",
        ["So it can travel to the small intestine first.", "Because the stomach is too cold for the active form.", "So it can digest starch before proteins.", "Because pepsin cannot dissolve in water."],
        null, "Cells are full of proteins. An enzyme that digests protein would destroy the cell making it, so it is made switched off."],
      ["What activates pepsinogen?", "Hydrochloric acid, which converts it into pepsin.", "process",
        ["Bile salts from the gallbladder.", "Bicarbonate from the pancreas.", "Salivary amylase.", "The alkaline mucus in the stomach."],
        null, "The acid is only found inside the stomach, so pepsin is only switched on where it is supposed to work."],
      ["What is the optimal pH of pepsin?", "About 2.", "number",
        ["About 7.", "About 8.", "About 5.", "About 12."],
        null, "That matches the acidic stomach, and it is also why pepsin stops working in the small intestine, where the pH is about 8."],
      ["What does pepsin do?", "It catalyzes hydrolysis reactions that break proteins into shorter polypeptides.", "process",
        ["It breaks proteins all the way down to individual amino acids.", "It catalyzes hydrolysis reactions that break starch into disaccharides.", "It breaks lipids down into glycerol and fatty acids.", "It joins amino acids together into proteins by dehydration synthesis."],
        null, "Pepsin only gets proteins part of the way. The shorter chains it leaves are finished off by other proteases in the small intestine."],

      /* ---------- absorption in the stomach ---------- */
      ["Why are only a few substances absorbed in the stomach?", "Most of the digestive processes are still incomplete at that stage.", "concept",
        ["The stomach has no blood supply.", "The stomach wall is covered in villi that block absorption.", "Everything has already been absorbed in the mouth.", "Acid destroys nutrients before they can be absorbed."],
        null, "Most molecules are still too large to cross into the blood. They have to wait for the small intestine to finish breaking them down."],
      ["What can be absorbed into the bloodstream from the stomach?", "Some water, salts and alcohol.", "list",
        ["Amino acids, glucose and fatty acids.", "Starch, proteins and fats.", "Vitamins made by bacteria.", "Bile salts and bile pigments."],
        null, "These are small enough to cross the stomach wall as they are, which is why alcohol takes effect so quickly."],
      ["What does the stomach absorb into the lymphatic system?", "Some lipid-soluble medications, such as aspirin.", "concept",
        ["Most of the glucose from a meal.", "All of the amino acids from proteins.", "Water-soluble vitamins.", "Undigested fibre."],
        null, "Being lipid-soluble lets them pass straight through cell membranes, which are made of lipids, before digestion is anywhere near complete."],

      /* ---------- physical and chemical digestion ---------- */
      ["What is physical, or mechanical, digestion?", "Breaking food into smaller pieces to increase the surface area available for chemical digestion by enzymes.", "term",
        ["Using enzymes to break the chemical bonds in macromolecules, producing monomers.", "Absorbing nutrients through the intestinal wall into the blood and lymph.", "Joining small molecules into larger ones by dehydration synthesis.", "Removing undigested food from the body through the rectum and anus."],
        null, "It changes the size of the pieces, not the molecules themselves. Its whole point is to make the enzymes' job faster."],
      ["What is chemical digestion?", "The hydrolysis of macromolecules using enzymes.", "term",
        ["Breaking food into smaller pieces by chewing and churning.", "The dehydration synthesis of monomers into polymers.", "Moving food along the tract by peristalsis.", "Absorbing nutrients into the blood."],
        null, "It is Topic 1's hydrolysis carried out by Topic 2's enzymes: water is used to break the bonds holding polymers together."],
      ["How does physical digestion contribute to the breakdown of macromolecules?", "It breaks food into smaller pieces and mixes it, increasing the surface area so enzymes can digest it faster.", "concept",
        ["It breaks the chemical bonds in macromolecules directly, so no enzymes are needed afterwards.", "It adds the water needed for hydrolysis, so enzymes can split the macromolecules.", "It activates the digestive enzymes by changing the pH of the food to their optimum.", "It absorbs the macromolecules into the blood before chemical digestion can begin."],
        null, "This is the Think About It. Your notes give three parts: more surface area, helping chemical digestion along, and mixing and moving the food."],

      /* ---------- the pancreas ---------- */
      ["What does the pancreas secrete into the duodenum?", "Digestive enzymes (carbohydrases, proteases and lipases) and bicarbonate ions.", "list",
        ["Bile, which contains bile salts for emulsifying fats and bile pigments.", "Hydrochloric acid and pepsinogen, which together start protein digestion.", "Hydrochloric acid and digestive enzymes (carbohydrases, proteases and lipases).", "Mucus and water only, to lubricate the chyme as it passes through."],
        null, "One organ sends in enzymes for every kind of macromolecule, plus the base needed to make the duodenum a safe place for them to work."],
      ["What do the pancreas's digestive enzymes finish breaking down?", "Carbohydrates, proteins, lipids and nucleic acids.", "list",
        ["Only proteins, since starch and fats are finished in the stomach.", "Only carbohydrates and fats; proteins are finished in the stomach.", "Only fats and oils, with the help of bile from the liver.", "Carbohydrates, proteins and the cellulose in dietary fibre."],
        null, "The pancreas covers every kind of macromolecule, which is why the small intestine can finish digesting everything a meal contains."],
      ["What does the bicarbonate from the pancreas do?", "It neutralizes the acidic chyme entering the duodenum from the stomach.", "process",
        ["It activates pepsinogen, turning it into pepsin in the duodenum.", "It emulsifies the fats in the chyme into many small droplets.", "It makes the duodenum more acidic so that pepsin keeps working.", "It digests the proteins in chyme into shorter polypeptides."],
        null, "Bicarbonate is a base. Chyme arrives at pH 1 to 3, which would denature the intestine's enzymes, so it has to be neutralized first."],
      ["What pH does bicarbonate bring the small intestine to?", "About 8, the optimal pH of the enzymes in the small intestine.", "number",
        ["About 2, the optimal pH of pepsin.", "About 7, the optimal pH of salivary amylase.", "About 5, slightly acidic.", "About 12, strongly basic."],
        null, "Slightly basic. It is a good example of each part of the tract keeping the pH its own enzymes need."],
      ["What carries the pancreas's secretions into the duodenum?", "The pancreatic duct.", "structure",
        ["The cystic duct.", "The left hepatic duct.", "The common hepatic duct.", "The esophagus."],
        null, "A duct is simply a tube that carries a secretion. Bile reaches the duodenum through a duct of its own, the common bile duct."],
      ["Are the pancreas's enzymes secreted active or inactive?", "Inactive. Enzymes from the cells lining the small intestine activate them.", "concept",
        ["Active, so they can start working inside the pancreas.", "Inactive. Stomach acid activates them on the way.", "Active, but they only work in the large intestine.", "Inactive. Bile salts activate them in the gallbladder."],
        null, "Same logic as pepsinogen: an organ full of proteins cannot safely hold working protein-digesting enzymes."],
      ["Why is it important that proteases are secreted in an inactive form?", "So they do not digest the proteins of the cells and ducts that make them before they reach the small intestine.", "concept",
        ["So they can survive the heat of the body until they reach the small intestine.", "So they digest all the carbohydrates first, before moving on to proteins.", "Because active proteases are too large to fit through the pancreatic duct.", "So they last longer, since an active enzyme is used up by each reaction."],
        null, "This is the Think About It. Your note puts it as getting them to where they are needed instead of working everywhere."],

      /* ---------- the small intestine ---------- */
      ["Name the three sections of the small intestine, in order.", "Duodenum, jejunum, ileum.", "list",
        ["Ileum, jejunum, duodenum.", "Duodenum, ileum, jejunum.", "Cecum, colon, rectum.", "Jejunum, duodenum, cecum."],
        null, "The duodenum comes first, right after the stomach, and the ileum comes last, leading into the large intestine."],
      ["Which section of the small intestine receives pancreatic juice and bile?", "The duodenum.", "structure",
        ["The jejunum.", "The ileum.", "The cecum.", "The pylorus."],
        null, "It is the first section after the stomach, so it is where acidic chyme is neutralized and the digestion of everything gets going."],
      ["How do the small and large intestines compare in size?", "The small intestine is much longer; the large intestine is shorter but wider in diameter.", "compare",
        ["The small intestine is shorter but wider; the large intestine is longer but narrower.", "Both are about the same length, but the small intestine is wider.", "The large intestine is both longer and wider than the small intestine.", "The small intestine is both longer and wider than the large intestine."],
        null, "The names describe width, not length. The small intestine's length is part of what gives it room to absorb so much."],
      ["What is the main role of the small intestine?", "It is a main site of digestion and the primary site where nutrients are absorbed.", "concept",
        ["It stores food for a few hours and kills bacteria with acid.", "It absorbs most of the water and stores feces until they are eliminated.", "It produces bile and stores excess glucose as glycogen.", "It digests proteins only, since carbohydrates and fats are finished earlier."],
        null, "Your notes adjust the handout: it shares digestion with the stomach, but it is the primary site of absorption."],
      ["What are villi?", "Finger-like projections on the inner wall of the small intestine that increase the surface area for absorption.", "term",
        ["Folds in the inner wall of the stomach that let it expand as it fills.", "Tiny hairs lining the trachea that sweep mucus and particles up and out of the airway.", "Rings of cartilage in the wall of the small intestine that hold it open.", "Glands in the wall of the small intestine that release bile and digestive enzymes."],
        null, "More surface means more places for nutrients to cross into the blood at once. Do not confuse them with rugae, which are in the stomach."],
      ["What is inside each villus?", "A network of blood capillaries and a lymphatic vessel called a lacteal.", "structure",
        ["A small gland that secretes bile into the intestine.", "A tiny air sac surrounded by a network of capillaries.", "A ring of cartilage that holds the villus upright.", "A duct that carries enzymes from the pancreas."],
        null, "Two routes out: the capillaries take water-soluble nutrients into the blood, and the lacteal takes fats into the lymph."],
      ["What is a lacteal?", "The lymphatic vessel inside each villus.", "term",
        ["A blood capillary in the stomach wall.", "The enzyme that digests lactose.", "A duct that carries bile.", "A fold in the large intestine."],
        null, "It looks milky after a fatty meal, which is where the name comes from: lact- means milk, as in lactose."],
      ["Where are most water-soluble nutrients absorbed into?", "The blood capillaries in the villi.", "concept",
        ["The lacteals in the villi.", "The lymph vessels of the colon.", "The cells of the stomach.", "The gallbladder."],
        null, "Blood is mostly water, so nutrients that dissolve in water, such as sugars and amino acids, travel easily in it."],
      ["Where are fat-soluble nutrients absorbed into?", "The lacteals, which carry them into the lymphatic system.", "concept",
        ["The blood capillaries, which carry them straight to the liver.", "The cells of the large intestine, along with water and salts.", "The rugae of the stomach, before the chyme moves on.", "The pancreatic duct, which carries them into the blood."],
        null, "Fats do not mix with water, so they take the lymphatic route first and only join the blood later."],
      ["What are microvilli?", "Microscopic projections on the cells covering the villi that increase the surface area for absorption even further.", "term",
        ["Small villi found only in the large intestine, where they absorb water and salts.", "Tiny hairs inside the nasal cavity that filter dust and particles out of the air.", "The network of tiny capillaries inside each villus that carries nutrients away.", "Microscopic folds on the inside of the stomach that let it stretch after a meal."],
        null, "Projections on projections: villi multiply the surface area, and microvilli on every villus multiply it again."],
      ["What are brush border cells?", "The cells lining the small intestine, which release mucus, water and more enzymes.", "term",
        ["The cells lining the stomach, which release hydrochloric acid and pepsinogen.", "The cells of the pancreas, which make bicarbonate and digestive enzymes.", "The cells of the liver, which make bile and store glycogen.", "The cells lining the trachea, which have cilia that sweep mucus away."],
        null, "They are named for the microvilli covering them, which look like the bristles of a brush under a microscope. Your note marks the mucus as a lubricant."],
      ["Relate the structure of the small intestine to its function.", "Its length, villi and microvilli give a huge surface area for absorption, and each villus has capillaries and a lacteal to carry nutrients away.", "concept",
        ["It is short and wide so that food passes through quickly, and its smooth inner wall stops nutrients sticking before they reach the colon.", "Its thick muscular walls and lack of blood vessels keep digestion separate from absorption, which happens later in the large intestine.", "Its rugae let it expand to store a whole meal, and its glands release acid that kills the bacteria swallowed with food.", "Its length lets it store food for many hours, and each villus contains an air sac where gases are exchanged with the blood."],
        null, "This is the Think About It. Nearly every feature of the small intestine either adds surface area or carries absorbed nutrients away."],

      /* ---------- physical digestion in the small intestine ---------- */
      ["What is segmentation?", "Contractions of circular muscles that divide the small intestine into segments, mixing chyme with digestive secretions.", "term",
        ["Waves of contraction and relaxation that push food down the esophagus toward the stomach.", "The division of the small intestine into three sections: the duodenum, jejunum and ileum.", "The churning of food with gastric juice by the stomach's muscles, which produces chyme.", "The breaking of fat into small droplets by bile salts, which helps lipase reach it."],
        null, "Unlike peristalsis it is mostly about mixing, not moving. It is the main way physical digestion continues in the small intestine."],
      ["Which muscles contract to form the segments in segmentation?", "Circular muscles.", "term",
        ["Longitudinal muscles.", "Intercostal muscles.", "Skeletal muscles.", "The diaphragm."],
        null, "They wrap around the intestine, so when they squeeze they pinch it into a chain of short segments."],
      ["How does segmentation help digestion and absorption?", "It separates the chyme then forces it back together, mixing it with digestive secretions.", "process",
        ["It breaks the chemical bonds in the chyme so the molecules are small enough to absorb.", "It pushes the chyme quickly into the large intestine before it can be digested.", "It neutralizes the acid in the chyme by squeezing bicarbonate out of the wall.", "It absorbs water from the chyme, turning it into solid feces."],
        null, "Splitting and recombining the chyme spreads enzymes through it and keeps bringing fresh chyme against the wall, where absorption happens."],
      ["What do the longitudinal muscles of the intestine do when they contract?", "They shorten sections of the intestine, helping to move and mix the chyme.", "process",
        ["They pinch the intestine into a chain of small segments.", "They close the pyloric sphincter so chyme cannot leave the stomach.", "They squeeze bile out of the gallbladder into the duodenum.", "They widen the intestine so the chyme slows down."],
        null, "They run lengthwise, so contracting shortens the tube. Working with the circular muscles, they make peristalsis possible."],
      ["What propels chyme forward through the small intestine?", "Peristalsis: coordinated contractions of the circular and longitudinal muscles.", "process",
        ["Segmentation: the circular muscles alone, pinching the chyme into segments.", "The beating of cilia on the villi, which sweep the chyme along the wall.", "The pressure of bile squeezed out of the gallbladder into the duodenum.", "Gravity, since the small intestine slopes steadily downward."],
        null, "Segmentation mostly mixes in place. Peristalsis is what actually moves things forward, using both muscle layers together."],

      /* ---------- carbohydrates ---------- */
      ["Where does the chemical digestion of carbohydrates continue after the mouth?", "In the small intestine.", "concept",
        ["In the stomach.", "In the large intestine.", "In the liver.", "In the esophagus."],
        null, "It pauses in the stomach, where acid denatures salivary amylase, and picks up again once bicarbonate has neutralized the chyme."],
      ["What is pancreatic amylase?", "A carbohydrase secreted by the pancreas into the small intestine.", "term",
        ["A protease secreted by the stomach lining into the chyme.", "A lipase secreted by the liver into the gallbladder.", "A hormone released by the pancreas to control blood sugar.", "The inactive form of salivary amylase, switched on by acid."],
        null, "It does the same job as salivary amylase, but in the small intestine, where the pH of about 8 suits it."],
      ["What does pancreatic amylase break the remaining starch into?", "Disaccharides.", "process",
        ["Monosaccharides directly.", "Amino acids.", "Glycerol and fatty acids.", "Polypeptides."],
        null, "It finishes what salivary amylase started. Splitting the disaccharides is a separate, final step done by other enzymes."],
      ["What do disaccharidases do?", "They catalyze the hydrolysis of disaccharides into monosaccharides.", "process",
        ["They join monosaccharides together into disaccharides.", "They catalyze the hydrolysis of starch into disaccharides.", "They break proteins down into individual amino acids.", "They neutralize the acidic chyme arriving from the stomach."],
        null, "Monosaccharides are the only carbohydrates small enough to absorb, so this is the last step of carbohydrate digestion."],
      ["Which cells release disaccharidases?", "The brush border cells lining the small intestine.", "structure",
        ["The cells of the salivary glands in the mouth.", "The cells lining the stomach, along with acid.", "The cells of the liver, which add them to bile.", "The cells lining the large intestine."],
        null, "Making them right at the absorbing surface means the sugars are freed exactly where they can be taken in."],
      ["How are monosaccharides absorbed into the cells of the small intestine?", "By active transport.", "process",
        ["By simple diffusion.", "By osmosis.", "Through the lacteals.", "By emulsification."],
        null, "Your note explains why: it moves them against the concentration gradient, and that requires energy."],
      ["Why does absorbing monosaccharides by active transport require energy?", "It moves them against their concentration gradient.", "concept",
        ["It moves them down their concentration gradient.", "Monosaccharides are too large to move any other way.", "The energy is needed to digest them first.", "The intestinal cells are colder than the blood."],
        null, "Moving from high to low concentration happens on its own. Pulling sugars in even when the cell already holds more costs energy, but wastes none."],
      ["How do monosaccharides get from the villi into the bloodstream?", "They diffuse into the capillary networks.", "process",
        ["They are actively pumped into the lacteals.", "They are coated in protein and enter the lymph.", "They are carried into the blood by bile.", "They pass through the pancreatic duct."],
        null, "Once inside the villus cells they are more concentrated than in the blood, so they move into the capillaries down their gradient."],
      ["What happens to monosaccharides once they are in the blood?", "They are carried to the body's cells, and any excess is stored in the liver as glycogen.", "process",
        ["They are all stored in fat cells, and none reach the other cells of the body.", "They are excreted in urine straight away, since cells cannot use them directly.", "They are rebuilt into starch in the muscles and stored there until needed.", "They are carried to the lungs, where they are broken down into carbon dioxide."],
        null, "Glycogen is the animal storage polysaccharide from Topic 1, built from those same glucose units."],
      ["Summarize the chemical digestion of carbohydrates from mouth to blood.", "Salivary amylase turns starch into disaccharides, digestion pauses in the stomach, then pancreatic amylase and disaccharidases finish it in the small intestine and monosaccharides are absorbed.", "process",
        ["Pepsin turns starch into disaccharides in the stomach, then bile finishes it in the small intestine and glucose is absorbed into the lacteals.", "Salivary amylase digests all the starch in the mouth, and glucose is then absorbed through the stomach wall.", "Starch passes undigested to the large intestine, where bacteria turn it into glucose that is absorbed into the blood.", "Lipase turns starch into monosaccharides in the small intestine, and they are stored in the gallbladder."],
        null, "This is the flowchart Think About It. Notice the pause in the stomach: no carbohydrase works at pH 1 to 3."],

      /* ---------- proteins ---------- */
      ["Which two proteases from the pancreas continue protein digestion in the small intestine?", "Trypsin and chymotrypsin.", "term",
        ["Pepsin and pepsinogen.", "Amylase and lipase.", "Maltase and lactase.", "Trypsin and amylase."],
        null, "Both are proteases even though neither ends in -ase, so they are worth memorizing by name. Pepsin stays behind in the stomach."],
      ["What do trypsin and chymotrypsin break polypeptides into?", "Short peptide chains.", "process",
        ["Individual amino acids.", "Glycerol and fatty acids.", "Disaccharides.", "Whole proteins."],
        null, "They cut long chains into shorter ones. A different set of enzymes finishes the job down to single amino acids."],
      ["What do peptidases do?", "They complete the breakdown of peptides into individual amino acids.", "process",
        ["They break the remaining starch down into disaccharides.", "They activate pepsinogen by converting it into pepsin.", "They join amino acids together into polypeptides.", "They emulsify fats so that lipase can reach them."],
        null, "This is the last step of protein digestion, because amino acids are the monomers small enough to absorb."],
      ["Where are peptidases secreted from?", "The pancreas and the brush border cells.", "structure",
        ["The salivary glands and the stomach.", "The stomach lining and the liver.", "The liver and the gallbladder.", "The large intestine and the rectum."],
        null, "Like disaccharidases, some are made right at the absorbing surface, so amino acids are freed where they can be taken in."],
      ["How are amino acids absorbed into the cells of the villi?", "By active transport.", "process",
        ["By passive diffusion into the lacteals.", "By being coated in protein first.", "By emulsification with bile.", "By osmosis along with water."],
        null, "The same route as monosaccharides: energy is used to bring them in, and then they diffuse into the capillaries."],
      ["Where does the blood carry amino acids after they are absorbed?", "To the liver for processing, then to the body's cells for protein synthesis.", "process",
        ["Straight to the lungs, where they are broken down and exhaled.", "Into the lacteals, then through the lymph to the gallbladder.", "To the kidneys, where they are stored until the body needs protein.", "Back to the stomach, where pepsin digests them a second time."],
        null, "Cells rebuild the amino acids into their own proteins, which is digestion in reverse: dehydration synthesis instead of hydrolysis."],
      ["Why are enzymes other than pepsin needed for protein digestion in the small intestine?", "Pepsin only breaks proteins into polypeptides and stops working at pH 8, so other proteases have to finish the job.", "concept",
        ["Pepsin is absorbed through the stomach wall, so none of it reaches the small intestine to keep working.", "Pepsin switches to digesting starch once it leaves the stomach, so proteins need other enzymes.", "Pepsin turns into bile in the duodenum and starts emulsifying fats instead of digesting protein.", "Pepsin works too quickly at pH 8, so it must be replaced by slower enzymes to avoid damage."],
        null, "This is the Think About It. There are two reasons: pepsin leaves the job half done, and the small intestine's pH is wrong for it anyway."],
      ["Summarize protein digestion from stomach to blood.", "Pepsin breaks proteins into polypeptides in the stomach; trypsin, chymotrypsin and peptidases break them into amino acids in the small intestine, and these are actively absorbed.", "process",
        ["Salivary amylase breaks proteins into amino acids in the mouth, these pass unchanged through the small intestine, and they are absorbed through the stomach wall into the blood.", "Pepsin breaks proteins all the way into amino acids in the stomach, bile carries them into the duodenum, and they are absorbed into the lacteals with the fats.", "Lipase breaks proteins into polypeptides in the small intestine, and bacteria in the large intestine finish them off before they are absorbed with water.", "Trypsin breaks proteins into polypeptides in the stomach, and pepsin and peptidases finish them in the small intestine, where they are absorbed passively."],
        null, "This is the flowchart Think About It. Protein is the only nutrient whose chemical digestion starts in the stomach."],

      /* ---------- lipids ---------- */
      ["Where does the chemical digestion of lipids occur?", "In the small intestine.", "concept",
        ["In the mouth.", "In the stomach.", "In the liver.", "In the large intestine."],
        null, "Fat passes through the mouth and stomach chemically untouched. It needs bile and pancreatic lipase, which only meet the food in the duodenum."],
      ["Which enzyme chemically digests lipids, and where does it come from?", "Lipase, secreted by the pancreas into the small intestine.", "term",
        ["Pepsin, secreted by the stomach.", "Amylase, secreted by the salivary glands.", "Bile, secreted by the liver.", "Trypsin, secreted by the brush border cells."],
        null, "Bile is not an enzyme. It only breaks fat into droplets; lipase is what actually breaks the bonds."],
      ["What does lipase break lipids down into?", "Glycerol and fatty acids.", "process",
        ["Amino acids.", "Monosaccharides.", "Polypeptides.", "Bile salts."],
        null, "A triglyceride was built from one glycerol and three fatty acids, so hydrolysis hands back exactly those."],
      ["How are glycerol and fatty acids absorbed into the cells of the villi?", "Passively.", "process",
        ["By active transport.", "Through the pancreatic duct.", "Only after being emulsified a second time.", "Directly into the blood capillaries."],
        null, "Unlike sugars and amino acids, no energy is used to bring them in. Being lipid-based, they pass through the cell membrane easily."],
      ["What happens to glycerol and fatty acids once they are inside the cells of the villi?", "They are reassembled into triglycerides and coated with protein to make them water-soluble.", "process",
        ["They are broken down further into glucose and released into the capillaries.", "They are joined into glycogen and stored inside the villus cells.", "They are pumped straight into the blood capillaries by active transport.", "They are converted into amino acids and sent to the liver."],
        null, "The cell rebuilds the fat it has just taken in, then wraps it so it can travel through watery fluids."],
      ["Why are the reassembled triglycerides coated with protein?", "To make them water-soluble so they can be transported.", "concept",
        ["To stop them from being digested again.", "To turn them into amino acids.", "To let them pass through the pyloric sphincter.", "To keep them stored in the villi for good."],
        null, "Lymph and blood are watery, and fat on its own would clump together. The protein coat lets it travel in water."],
      ["Where do the coated triglycerides go after leaving the villus cells?", "Into the lacteals, then through the lymphatic system to the circulatory system.", "process",
        ["Straight into the blood capillaries, then to the liver for processing.", "Back into the small intestine, to be emulsified again by bile.", "Into the gallbladder, where they are stored until the next meal.", "Into the large intestine, where bacteria finish digesting them."],
        null, "Your notes circle it: lacteals. This is why fat-soluble nutrients are said to enter the lymphatic system."],
      ["What happens to the triglycerides once they reach the circulatory system?", "The protein coat is removed and lipase lining the blood vessels breaks them back into glycerol and fatty acids.", "process",
        ["The protein coat is kept on, and they are stored in the liver as glycogen until needed.", "They are carried to the lungs, broken down, and exhaled as carbon dioxide and water.", "The protein coat is removed and pepsin in the blood breaks them into amino acids.", "They are filtered out by the kidneys and excreted in urine, still coated in protein."],
        null, "Breaking them down again lets the small glycerol and fatty acid molecules leave the blood and enter the body's cells."],
      ["Compare the absorption of amino acids with the absorption of glycerol and fatty acids.", "Amino acids are actively transported into the villi and diffuse into the blood; glycerol and fatty acids are absorbed passively, rebuilt into coated triglycerides and enter the lacteals.", "compare",
        ["Both are absorbed passively into the villi and then diffuse straight into the blood capillaries, so there is no real difference between them.", "Amino acids are absorbed passively and enter the lacteals; glycerol and fatty acids are actively transported into the villi and diffuse into the blood.", "Both are actively transported into the villi, rebuilt into larger molecules coated with protein, and carried away in the lymph.", "Amino acids are absorbed in the stomach and enter the blood there; glycerol and fatty acids are absorbed in the large intestine with water."],
        null, "This is the Think About It. There are two differences: active versus passive uptake, and blood versus lymph as the route out of the villus."],
      ["Summarize lipid digestion from the small intestine to the body's cells.", "Bile emulsifies the fat, lipase splits it into glycerol and fatty acids, these are absorbed and rebuilt into coated triglycerides, carried by the lymph to the blood, and split again for the cells.", "process",
        ["Pepsin splits fat into amino acids in the stomach, these are actively transported into the villi, and they diffuse into the blood capillaries to reach the cells.", "Bile digests the fat into glucose in the duodenum, the glucose is absorbed by active transport, and any excess is stored in the gallbladder as glycogen.", "Lipase splits fat in the mouth, the fatty acids are absorbed through the stomach wall, and they travel in the blood to the cells unchanged.", "Bacteria digest fat in the colon, the fatty acids are absorbed with the water and salts, and whatever is left over is egested in the feces."],
        null, "This is the flowchart Think About It. Fat is the nutrient that is taken apart, put back together, and taken apart again on its way in."],

      /* ---------- the large intestine ---------- */
      ["What two parts make up the large intestine?", "The colon and the rectum.", "structure",
        ["The duodenum and the ileum.", "The cecum and the jejunum.", "The colon and the appendix only.", "The rectum and the pylorus."],
        null, "The colon does the absorbing, and the rectum does the storing until the feces can be eliminated."],
      ["What does the colon absorb?", "Water and electrolytes (salts), along with vitamins and small organic molecules made by bacteria.", "list",
        ["Most of the glucose and amino acids from a meal, along with some water.", "Bile salts and pancreatic enzymes, so they can be made into new ones.", "The undigested fibre, which bacteria turn into glucose for the blood.", "Glycerol and fatty acids, which it sends into its own lacteals."],
        null, "Taking back water is what turns the watery leftovers into solid feces. When too little is absorbed, the result is diarrhea."],
      ["What forms the feces?", "The undigested matter left over once the colon has absorbed water and salts.", "concept",
        ["Excess glucose that the small intestine stored in the rectum.", "Bile salts that the liver could not reuse, mixed with water.", "Proteins that the stomach could not digest, and nothing else.", "Dead cells from the lining of the stomach, and nothing from food."],
        null, "Concentrating the leftovers is the colon's main job: by the time material reaches the rectum, most of its water has been taken back."],
      ["Where are feces stored until they are eliminated?", "In the rectum.", "structure",
        ["In the colon.", "In the cecum.", "In the gallbladder.", "In the ileum."],
        null, "When the rectum fills, the internal anal sphincter relaxes on its own, and the external one decides the timing."],
      ["What do the bacteria living in the colon do?", "They continue to digest waste material.", "process",
        ["They make bile for fat digestion.", "They absorb water into the blood.", "They neutralize stomach acid.", "They digest proteins into amino acids for the body."],
        null, "This is the only chemical digestion in the large intestine, and the small molecules the bacteria produce are absorbed by the colon."],
      ["Why do the cells lining the colon produce mucus?", "To help substances move through the large intestine.", "concept",
        ["To digest the remaining starch.", "To kill the bacteria living there.", "To protect the colon from stomach acid.", "To absorb vitamins."],
        null, "As water is absorbed the contents get drier and harder, so lubrication keeps them moving."],
      ["What forms the bulk of feces?", "Dietary fibre, such as cellulose, which humans cannot digest.", "concept",
        ["Undigested proteins that pepsin and trypsin could not break down.", "Dead red blood cells removed from the body by the liver.", "Excess glucose that the small intestine could not absorb.", "Unused bile salts that the gallbladder did not store."],
        null, "Topic 1 explains why: human enzymes cannot break the bonds in cellulose, so it passes all the way through."],
      ["Does chemical digestion happen in the large intestine?", "Only by the bacteria that live there.", "concept",
        ["Yes, it is the main site of protein digestion.", "Yes, it releases lipase to digest fats.", "No, nothing at all is broken down there.", "Yes, it finishes digesting starch with amylase."],
        null, "The summary puts it as no chemical digestion except by bacteria. The large intestine's own job is mostly absorbing water and salts."],
      ["What mechanical digestion happens in the large intestine?", "Segmental mixing, and mass movements that push material along.", "process",
        ["Churning with gastric juice to turn the contents into chyme.", "Emulsification of the remaining fat by bile salts.", "Grinding by hard ridges in the wall of the colon.", "None at all, because only bacteria work on the contents."],
        null, "Mass movements are strong waves that sweep the contents toward the rectum a few times a day."],
      ["What is the first part of the large intestine, where the appendix is attached?", "The cecum.", "structure",
        ["The ileum.", "The sigmoid colon.", "The duodenum.", "The rectum."],
        null, "Material from the ileum passes through the ileocecal sphincter straight into it, which is how that sphincter gets its name."],
      ["Name the sections of the colon in the order material passes through them.", "Ascending, transverse, descending, then sigmoid colon.", "list",
        ["Descending, transverse, ascending, then sigmoid colon.", "Sigmoid, ascending, transverse, then descending colon.", "Transverse, ascending, sigmoid, then descending colon.", "Ascending, descending, transverse, then sigmoid colon."],
        null, "It runs up the right side, across the top and down the left side, then curves in an S into the rectum. Sigmoid means S-shaped."],

      /* ---------- the summary ---------- */
      ["Which organ chemically digests carbohydrates, lipids, proteins and nucleic acids?", "The small intestine.", "concept",
        ["The stomach.", "The mouth.", "The large intestine.", "The liver."],
        null, "It is the only place where enzymes for every macromolecule meet the food, thanks to the pancreas and the brush border cells."],
      ["Which organ absorbs peptides, amino acids, glucose, fructose, lipids, water, minerals and vitamins?", "The small intestine.", "concept",
        ["The stomach.", "The large intestine.", "The esophagus.", "The gallbladder."],
        null, "Nearly every nutrient is absorbed here. By the time material reaches the large intestine, mostly water and salts are left to take back."],
      ["In which organ do peristaltic mixing, protein digestion and the absorption of lipid-soluble substances such as aspirin all happen?", "The stomach.", "concept",
        ["The small intestine.", "The large intestine.", "The mouth.", "The esophagus."],
        null, "That is the stomach's line on the summary diagram. Its absorption is limited to small or lipid-soluble molecules."],
      ["In which organ are ions, water, minerals, vitamins and molecules made by bacteria absorbed?", "The large intestine.", "concept",
        ["The small intestine.", "The stomach.", "The esophagus.", "The liver."],
        null, "That is the large intestine's line on the summary diagram, alongside its segmental mixing and mass movements."],
    ],
  },

      ["What kind of organ is the liver in the digestive system?", "An accessory organ: it aids digestion, but food does not pass through it.", "concept",
